      <p>Le sommeil est fait de <b>cycles</b> qui s'encha\xEEnent. Chez le nouveau-n\xE9, un cycle dure <b>50 \xE0 60 minutes</b>. Il dure environ 70 minutes vers 6 \xE0 12 mois, puis 90 \xE0 120 minutes vers 2 \xE0 3 ans.</p>
      <p>Chaque cycle alterne deux phases :</p>
      <ul><li><b>Le sommeil agit\xE9</b> : le b\xE9b\xE9 bouge, grimace, sourit, ses yeux bougent sous les paupi\xE8res, sa respiration est irr\xE9guli\xE8re. Il dort pourtant bien ! Avant 6 mois, c'est la moiti\xE9 de son sommeil, et c'est par lui qu'il s'endort.</li>
      <li><b>Le sommeil calme</b> : immobile, respiration r\xE9guli\xE8re. C'est le sommeil profond, qui prend de plus en plus de place en grandissant.</li></ul>
      <p>Entre deux cycles, il y a souvent un petit r\xE9veil. Beaucoup de b\xE9b\xE9s se rendorment seuls si on leur en laisse le temps.</p>
      <div class="g-tip"><b>En pratique</b> Quand b\xE9b\xE9 bouge ou g\xE9mit en dormant, attends quelques instants avant d'intervenir : il est peut-\xEAtre simplement en sommeil agit\xE9 ou entre deux cycles.</div>`,why:"Comprendre les cycles explique pourquoi une sieste dure souvent un multiple de 45 \xE0 60 minutes, et pourquoi un b\xE9b\xE9 qui s'agite n'est pas forc\xE9ment r\xE9veill\xE9.",app:["log","Voir la dur\xE9e de ses siestes dans le journal"],src:["sommeilNormal"],quiz:["Un b\xE9b\xE9 de 2 mois bouge, grimace et respire de fa\xE7on irr\xE9guli\xE8re les yeux ferm\xE9s. Que se passe-t-il le plus souvent ?",["Il est r\xE9veill\xE9 et a besoin qu'on le prenne","Il est en sommeil agit\xE9 : il dort","Il fait un cauchemar"],1]},{id:"wake-windows",title:"Temps d'\xE9veil et signes de fatigue",min:4,body:()=>{const e=i.child.birth?$e(i.child.birth,Date.now()):null,t=At.filter(n=>n[0]<=24);return`<p>Le <b>temps d'\xE9veil</b>, c'est la dur\xE9e pendant laquelle un b\xE9b\xE9 reste \xE9veill\xE9 entre deux sommeils. Il est court chez le nouveau-n\xE9 et s'allonge en grandissant.</p>
      <p>Les signes de fatigue apparaissent quand ce temps touche \xE0 sa fin : <b>il b\xE2ille, se frotte les yeux, pleurniche</b>, d\xE9tourne le regard, devient moins souriant. C'est le moment de le coucher <b>sans attendre</b>.</p>
      <p>Si on d\xE9passe ce moment, beaucoup de b\xE9b\xE9s deviennent plus agit\xE9s, pas plus fatigu\xE9s en apparence, et l'endormissement devient plus difficile.</p>
      <h4>Les rep\xE8res qu'utilise Doudodo</h4>
      <table class="g-tab"><tr><th>\xC2ge</th><th>\xC9veil avant une sieste</th><th>Siestes par jour</th></tr>${t.map((n,a)=>{const s=t[a+1],r=e!=null&&e>=n[0]&&(!s||e<s[0]);return`<tr${r?' class="me"':""}><td>${n[0]===0?"Naissance":n[0]+" mois"}${r?`<small>${w(H())} est ici</small>`:""}</td><td><b>${C(n[1])}</b></td><td>${n[2]}</td></tr>`}).join("")}</table>
      <p class="g-small">Ces dur\xE9es sont des rep\xE8res pratiques, pas une norme m\xE9dicale : ils servent de point de d\xE9part, puis Doudodo les ajuste avec ce que tu notes. Les signes de fatigue de ton enfant restent le meilleur indicateur.</p>`},why:"Coucher un b\xE9b\xE9 quand il commence \xE0 fatiguer, ni trop t\xF4t ni trop tard, rend souvent l'endormissement plus facile et les siestes plus longues. C'est tout le principe des cr\xE9neaux de Doudodo.",app:["home","Voir le cr\xE9neau conseill\xE9 sur l'accueil"],src:["rythme","sommeilNormal"],quiz:["Lequel de ces signes montre le plus souvent qu'un b\xE9b\xE9 commence \xE0 fatiguer ?",["Il se frotte les yeux et b\xE2ille","Il r\xE9clame \xE0 manger","Il gazouille et sourit"],0]},{id:"naps",title:"Les siestes et leurs transitions",min:3,body:()=>`
      <p>Le nombre de siestes diminue par \xE9tapes. Rep\xE8res habituels :</p>
      <ul><li><b>Avant 6 mois</b> : le b\xE9b\xE9 dort une bonne partie de la journ\xE9e, souvent 3 \xE0 5 siestes.</li>
      <li><b>Vers 6 mois</b> : 3 siestes (matin, d\xE9but et fin d'apr\xE8s-midi).</li>
      <li><b>Entre 6 mois et 1 an</b> : la sieste de fin d'apr\xE8s-midi dispara\xEEt, il en reste 2.</li>
      <li><b>Vers 18 mois</b> : la sieste du matin dispara\xEEt, il en reste 1.</li>
      <li><b>De 2 \xE0 3 ans</b> : une sieste d'environ 2 h en d\xE9but d'apr\xE8s-midi ; 9 enfants sur 10 en font encore une \xE0 cet \xE2ge.</li></ul>
      <p>Une transition se fait rarement du jour au lendemain : pendant quelques jours ou semaines, l'enfant alterne entre l'ancien et le nouveau rythme. Une sieste qui devient tr\xE8s difficile \xE0 obtenir, ou un endormissement du soir qui recule, sont des signes fr\xE9quents.</p>
      <div class="g-tip"><b>Dans Doudodo</b> Quand ton enfant fait une sieste de moins pendant 3 jours complets, l'accueil propose d'adapter les horaires tout de suite.</div>`,why:"Rep\xE9rer une transition \xE9vite de forcer une sieste dont l'enfant n'a plus besoin, ou au contraire de supprimer trop t\xF4t une sieste encore utile.",app:["stats","Voir son rythme actuel dans Suivi"],src:["sommeilNormal"],quiz:["Vers quel \xE2ge la sieste du matin dispara\xEEt-elle le plus souvent ?",["Vers 6 mois","Vers 18 mois","Vers 3 ans"],1]},{id:"four-months",title:"Vers 4 mois, le sommeil change",min:3,body:()=>`
      <p>Vers 4 mois, beaucoup de parents trouvent que le sommeil de leur b\xE9b\xE9 \xAB se d\xE9r\xE8gle \xBB : plus de r\xE9veils la nuit, siestes plus courtes. On parle souvent de \xAB r\xE9gression des 4 mois \xBB.</p>
      <p>En r\xE9alit\xE9, c'est plut\xF4t une <b>maturation</b> : le sommeil se r\xE9organise, la part de sommeil calme augmente, et le rythme jour/nuit se consolide. C'est aussi l'\xE2ge o\xF9 beaucoup de b\xE9b\xE9s deviennent capables d'encha\xEEner de longues nuits, mais \xE0 des moments tr\xE8s diff\xE9rents selon les enfants.</p>
      <p>Pendant cette p\xE9riode, le b\xE9b\xE9 d\xE9couvre beaucoup de choses (attraper, se retourner, regarder autour de lui), ce qui peut aussi perturber ses siestes.</p>
      <div class="g-tip"><b>Ce qui aide souvent</b> Garder des horaires r\xE9guliers, un rituel du coucher simple, beaucoup de lumi\xE8re et d'activit\xE9 le jour, du calme et de la p\xE9nombre le soir.</div>
      <p>C'est le plus souvent passager. Si les r\xE9veils s'accompagnent de fi\xE8vre, de pleurs inhabituels ou si tu es inquiet, parles-en \xE0 ton m\xE9decin.</p>`,why:"Savoir que ce changement est fr\xE9quent et souvent temporaire aide \xE0 garder confiance et \xE0 ne pas tout changer en m\xEAme temps.",app:["stats","Suivre l'\xE9volution de ses nuits"],src:["sommeilNormal","rythme"],quiz:["Le changement de sommeil fr\xE9quent vers 4 mois est surtout li\xE9 \xE0\u2026",["Une maturation du sommeil","Une maladie \xE0 traiter","Un manque de lait"],0]},{id:"nights",title:"Faire ses nuits et les r\xE9veils nocturnes",min:3,body:()=>`
      <p>\xC0 la naissance, le b\xE9b\xE9 ne fait pas la diff\xE9rence entre le jour et la nuit. Le rythme jour/nuit s'installe <b>progressivement</b>, \xE0 partir du 2e mois environ.</p>
      <p>Avant 6 mois, se r\xE9veiller toutes les <b>3 \xE0 4 heures</b> est normal, notamment pour manger. Vers 4 mois, beaucoup de b\xE9b\xE9s deviennent capables de dormir 8 \xE0 9 heures d'affil\xE9e ; d'autres mettront plus de temps, et c'est normal aussi.</p>
      <p>M\xEAme plus grand, un enfant se r\xE9veille bri\xE8vement plusieurs fois par nuit, entre deux cycles. L'important est qu'il apprenne peu \xE0 peu \xE0 se rendormir seul.</p>
      <div class="g-tip"><b>Ce qui aide</b> De la lumi\xE8re et de l'activit\xE9 le jour, une nuit sombre et calme, des r\xE9veils nocturnes discrets (peu de lumi\xE8re, peu de paroles).</div>`,why:"\xAB Faire ses nuits \xBB n'a pas d'\xE2ge fixe. Comparer son b\xE9b\xE9 \xE0 celui des autres cr\xE9e souvent plus d'inqui\xE9tude que n\xE9cessaire.",app:["log","Noter les r\xE9veils de la nuit dans le journal"],src:["sommeilNormal","rythme"],quiz:["Avant 6 mois, des r\xE9veils toutes les 3 \xE0 4 heures la nuit sont\u2026",["Normaux","Le signe d'un probl\xE8me","Rares"],0]},{id:"ritual",title:"Le rituel du coucher",min:2,body:()=>`
      <p>Un rituel, ce sont quelques gestes simples, toujours dans le m\xEAme ordre, qui annoncent le sommeil. Il prend de l'importance vers 6 \xE0 8 mois.</p>
      <ul><li>Un <b>sas de calme</b> avant le coucher : lumi\xE8re plus douce, moins de bruit, pas d'\xE9cran.</li>
      <li>Une histoire, une chanson, un c\xE2lin, le doudou.</li>
      <li>Des horaires de coucher r\xE9guliers, sans \xEAtre trop stricts.</li>
      <li>Si possible, le coucher <b>encore \xE9veill\xE9</b>, pour qu'il apprenne \xE0 s'endormir seul.</li>
      <li>Une porte entrouverte avec de la lumi\xE8re dans la pi\xE8ce voisine rassure souvent plus qu'une veilleuse.</li></ul>`,why:"Les rituels donnent des rep\xE8res. L'enfant comprend ce qui va se passer, ce qui rend la s\xE9paration du coucher plus facile.",app:["home","Voir l'heure du coucher conseill\xE9e"],src:["rythme"],quiz:["Quel moment est le plus conseill\xE9 pour poser b\xE9b\xE9 dans son lit ?",["Quand il est d\xE9j\xE0 profond\xE9ment endormi","Quand il est somnolent mais encore \xE9veill\xE9","Peu importe"],1]},{id:"safe-sleep",title:"Dormir en s\xE9curit\xE9",min:3,key:!0,body:()=>`
      <p>Ces gestes r\xE9duisent le risque de mort inattendue du nourrisson. Ils valent pour <b>chaque sommeil</b>, la nuit comme la sieste :</p>
      <ul class="g-check"><li><b>Sur le dos</b>, \xE0 plat, jamais sur le ventre ni sur le c\xF4t\xE9.</li>
      <li>Dans <b>son propre lit</b>, \xE0 barreaux, avec un matelas ferme et un drap-housse bien ajust\xE9. Pas de tour de lit.</li>
      <li>Une <b>turbulette</b> (gigoteuse) adapt\xE9e \xE0 sa taille : pas d'oreiller, de couette, de couverture ni de peluche dans le lit.</li>
      <li>Une chambre \xE0 <b>18 \xE0 20 \xB0C</b>, a\xE9r\xE9e chaque jour. S'il fait plus chaud, un body ou un pyjama l\xE9ger suffit.</li>
      <li><b>Aucun tabac</b> pr\xE8s de l'enfant, cigarette \xE9lectronique comprise.</li>
      <li>Jamais dans un lit d'adulte, un canap\xE9, un fauteuil ou un pouf, m\xEAme pour une courte sieste.</li>
      <li>Rien autour du cou (bavoir, collier, cordon) et pas de coussin ou serviette pour le caler.</li>
      <li>Dans un lit parapluie, ne pas ajouter de matelas suppl\xE9mentaire.</li></ul>
      <p>Les premiers mois, le lit du b\xE9b\xE9 est id\xE9alement dans la chambre des parents.</p>`,why:"Ce sont les recommandations les plus importantes de tout ce guide : elles prot\xE8gent la vie de ton enfant.",app:null,src:["coucher","coucherSante"],quiz:["Pour une courte sieste dans la journ\xE9e, comment coucher b\xE9b\xE9 ?",["Sur le ventre, s'il dort mieux ainsi","Sur le canap\xE9 \xE0 c\xF4t\xE9 de soi","Sur le dos, dans son lit, comme la nuit"],2]}]},{id:"manger",title:"Manger",ic:"bottle",cls:"meal",items:[{id:"feeding",title:"T\xE9t\xE9es et biberons",min:3,body:()=>`
      <p>Les premiers mois, le lait (maternel ou infantile) est le seul aliment du b\xE9b\xE9. Il se donne <b>\xE0 la demande</b> : le b\xE9b\xE9 sait r\xE9guler ce dont il a besoin, et ses besoins varient d'un jour \xE0 l'autre.</p>
      <p>Signes de faim fr\xE9quents : il ouvre la bouche, tourne la t\xEAte pour chercher, porte les mains \xE0 la bouche, s'agite. Les pleurs sont souvent un signe <b>tardif</b> de faim.</p>
      <p>Signes qu'il a assez mang\xE9 : il ralentit, l\xE2che le sein ou la t\xE9tine, d\xE9tourne la t\xEAte, se d\xE9tend.</p>
      <div class="g-tip"><b>Pour les biberons</b> Respecte exactement les doses indiqu\xE9es sur la bo\xEEte : un lait trop dilu\xE9 ou trop concentr\xE9 peut rendre b\xE9b\xE9 malade. Pour les quantit\xE9s, suis les rep\xE8res de ton p\xE9diatre.</div>`,why:"Faire confiance aux signaux de l'enfant plut\xF4t qu'\xE0 un horaire fixe lui permet de manger selon sa faim, ce qui prot\xE8ge aussi son rapport \xE0 la nourriture plus tard.",app:["home","Noter un repas en un appui sur l'accueil"],src:["mille","couches"],quiz:["Quel est le plus souvent un signe tardif de faim ?",["Porter les mains \xE0 la bouche","Les pleurs","Tourner la t\xEAte pour chercher"],1]},{id:"diversification",title:"La diversification",min:4,body:()=>`
      <p>La diversification, c'est l'introduction d'aliments autres que le lait. Pour un enfant n\xE9 \xE0 terme et en bonne sant\xE9, elle commence <b>entre 4 et 6 mois</b> (avis m\xE9dical pour un enfant pr\xE9matur\xE9 ou malade).</p>
      <ul><li><b>Le lait reste l'aliment principal</b> pendant la premi\xE8re ann\xE9e.</li>
      <li><b>Les allerg\xE8nes ne sont plus \xE0 retarder</b> : \u0153uf bien cuit, poisson, produits laitiers, gluten, arachide (en p\xE2te, jamais enti\xE8re), fruits \xE0 coque finement mix\xE9s, en petites quantit\xE9s. Les retarder ne prot\xE8ge pas des allergies.</li>
      <li><b>Textures</b> : pur\xE9es tr\xE8s lisses au d\xE9but, puis plus \xE9paisses, \xE9cras\xE9es, et petits morceaux fondants entre 6 et 12 mois.</li>
      <li><b>Quantit\xE9s</b> : il n'y a pas de quantit\xE9 id\xE9ale. Certains b\xE9b\xE9s mangent vite 100 \xE0 150 g de l\xE9gumes, d'autres 2 ou 3 cuill\xE8res. Pour la viande, le poisson ou l'\u0153uf : environ 10 g par jour la premi\xE8re ann\xE9e.</li>
      <li>Ajouter un peu de mati\xE8re grasse (huile v\xE9g\xE9tale ou beurre) d\xE8s le d\xE9but.</li></ul>
      <div class="g-tip"><b>S\xE9curit\xE9</b> Toujours assis bien droit, sous la surveillance d'un adulte. Pas de fruits \xE0 coque entiers, cacahu\xE8tes, raisins entiers ou morceaux durs de carotte crue : risque d'\xE9touffement.</div>`,why:"Apr\xE8s 6 mois, le lait seul ne couvre plus tous les besoins, notamment en fer. Introduire t\xF4t une grande vari\xE9t\xE9 d'aliments aide aussi \xE0 pr\xE9venir les allergies.",app:["home","Noter un repas solide avec \xAB Repas \xBB"],src:["diversif","diversifSpf"],quiz:["Faut-il retarder l'\u0153uf ou l'arachide pour \xE9viter les allergies ?",["Oui, jusqu'\xE0 1 an","Non, on les introduit pendant la diversification","Oui, jusqu'\xE0 3 ans"],1]}]},{id:"sante",title:"Sant\xE9 et couches",ic:"temp",cls:"temp",items:[{id:"diapers",title:"Couches : ce qui est normal",min:3,body:()=>`
      <p>Les couches renseignent sur ce que boit le b\xE9b\xE9, surtout les premi\xE8res semaines.</p>
      <ul><li><b>Pipi</b> : \xE0 partir du 5e jour, au moins <b>6 couches mouill\xE9es par jour</b>.</li>
      <li><b>Selles</b> : tr\xE8s fonc\xE9es les 2 ou 3 premiers jours (m\xE9conium), puis jaun\xE2tres, verd\xE2tres ou brun\xE2tres, liquides ou tr\xE8s molles. Les premi\xE8res semaines, 3 \xE0 10 selles par jour, c'est courant.</li>
      <li>Apr\xE8s 4 \xE0 6 semaines, certains b\xE9b\xE9s allait\xE9s n'ont des selles que tous les 3 \xE0 7 jours : si elles restent molles et que b\xE9b\xE9 va bien, ce n'est pas un probl\xE8me.</li></ul>
      <div class="g-warn"><b>Consulte rapidement si</b> les selles sont <b>blanches, grises ou tr\xE8s p\xE2les</b>, rouges ou noires (sang possible), si les pipis deviennent rares, fonc\xE9s et odorants, ou s'il y a une diarrh\xE9e chez un b\xE9b\xE9 qui semble malade.</div>`,why:"Compter les couches est un moyen simple de v\xE9rifier que b\xE9b\xE9 boit assez, surtout pendant le premier mois.",app:["stats","Voir le nombre de couches dans le r\xE9sum\xE9"],src:["couches"],quiz:["\xC0 partir du 5e jour, combien de couches mouill\xE9es par jour au minimum ?",["2","6","15"],1]},{id:"fever",title:"La fi\xE8vre : quand s'inqui\xE9ter ?",min:4,key:!0,body:()=>`
      <p>On parle de fi\xE8vre au-del\xE0 de <b>38 \xB0C</b>. La mesure de r\xE9f\xE9rence se fait avec un thermom\xE8tre \xE9lectronique <b>dans les fesses</b> (rectale) ; sous le bras, la mesure est plus longue et souvent un peu plus basse.</p>
      <div class="g-warn"><b>Consulte en urgence si</b><ul>
        <li>le b\xE9b\xE9 a <b>moins de 3 mois</b> et a de la fi\xE8vre ;</li>
        <li>il respire difficilement ou tr\xE8s vite ;</li>
        <li>il est anormalement endormi, mou, ne r\xE9agit pas ;</li>
        <li>il est tr\xE8s p\xE2le ou bleut\xE9, a des cris faibles ou des g\xE9missements ;</li>
        <li>sa fontanelle est bomb\xE9e ou sa nuque raide.</li></ul>Ton ressenti de parent compte : si quelque chose te semble anormal, appelle le 15.</div>
      <p><b>Ce qui aide</b> : lui proposer souvent \xE0 boire, ne pas trop le couvrir, ne pas surchauffer la pi\xE8ce. Les bains frais et linges mouill\xE9s sont d\xE9conseill\xE9s : leur effet est faible et ils augmentent l'inconfort.</p>
      <p>Si un m\xE9dicament est n\xE9cessaire, le parac\xE9tamol est le traitement de premi\xE8re intention, \xE0 la dose correspondant au <b>poids</b> de l'enfant (indiqu\xE9e sur la notice ou l'ordonnance). Jamais d'aspirine. L'ibuprof\xE8ne n'est possible qu'\xE0 partir de 3 mois, sur avis m\xE9dical, et pas en cas de varicelle.</p>`,why:"La fi\xE8vre est le plus souvent la r\xE9action normale \xE0 une infection banale. Savoir reconna\xEEtre les signes de gravit\xE9 permet de r\xE9agir vite quand il le faut, et de rester serein le reste du temps.",app:["home","Noter une temp\xE9rature ou un m\xE9dicament dans \xAB Sant\xE9 \xBB"],src:["fievre"],quiz:["Un b\xE9b\xE9 de 6 semaines a 38,5 \xB0C. Que faire ?",["Attendre 48 h","Consulter rapidement","Lui donner un bain froid"],1]},{id:"crying",title:"Les pleurs et le b\xE9b\xE9 secou\xE9",min:3,key:!0,body:()=>`
      <p>Tous les b\xE9b\xE9s pleurent, parfois longtemps et sans raison apparente, surtout les premiers mois. Ce n'est la faute de personne, et c'est souvent \xE9puisant.</p>
      <p>V\xE9rifie d'abord les besoins simples : faim, couche, chaud ou froid, fatigue, besoin d'\xEAtre port\xE9 et rassur\xE9.</p>
      <div class="g-warn"><b>Si tu sens que tu perds patience</b><ul>
        <li>Couche b\xE9b\xE9 <b>sur le dos dans son lit</b> et <b>sors de la pi\xE8ce</b> quelques minutes.</li>
        <li>Respire, appelle quelqu'un : ton ou ta partenaire, un proche, ton m\xE9decin.</li>
        <li><b>Ne secoue jamais un b\xE9b\xE9</b>, m\xEAme quelques secondes.</li></ul></div>
      <p>Secouer un b\xE9b\xE9 provoque des l\xE9sions graves du cerveau : 10 \xE0 40 % des b\xE9b\xE9s secou\xE9s en meurent et la plupart des survivants gardent des s\xE9quelles \xE0 vie. Cela touche surtout les moins de 6 mois.</p>
      <p>Si la personne qui garde ton enfant (nounou, grands-parents) est seule avec lui, parle-lui de ce r\xE9flexe : le poser en s\xE9curit\xE9 et s'\xE9loigner.</p>`,why:"Les pleurs sont le premier facteur d\xE9clenchant du syndrome du b\xE9b\xE9 secou\xE9. Avoir un plan avant d'\xEAtre \xE0 bout prot\xE8ge ton enfant et toi.",app:["set","Inviter la personne qui garde ton enfant"],src:["secoue"],quiz:["B\xE9b\xE9 pleure depuis longtemps et tu es \xE0 bout. Que faire ?",["Le bercer tr\xE8s fort pour qu'il se calme","Le coucher sur le dos dans son lit et sortir quelques minutes","Le secouer doucement"],1]}]},{id:"grandir",title:"Grandir",ic:"ruler",cls:"growth",items:[{id:"growth",title:"Poids, taille et courbes",min:2,body:()=>`
      <p>Le poids, la taille et le p\xE9rim\xE8tre cr\xE2nien sont mesur\xE9s \xE0 chaque visite m\xE9dicale et report\xE9s dans le <b>carnet de sant\xE9</b>, sur des courbes de r\xE9f\xE9rence.</p>
      <p>Ce qui compte n'est pas une mesure isol\xE9e, mais la <b>r\xE9gularit\xE9 de la courbe</b> : un enfant peut \xEAtre petit ou grand, tant qu'il suit sa propre trajectoire. C'est le m\xE9decin qui interpr\xE8te ces courbes.</p>
      <div class="g-tip"><b>Pour des mesures comparables</b> P\xE8se ton b\xE9b\xE9 toujours dans les m\xEAmes conditions (m\xEAme balance, m\xEAme moment, nu ou avec une couche propre).</div>`,why:"Une cassure de courbe est l'un des premiers signes qu'un enfant a besoin d'attention m\xE9dicale. Noter les mesures aide \xE0 en parler avec le p\xE9diatre.",app:["grow","Ajouter une mesure dans Suivi"],src:["mille"],quiz:["Qu'est-ce qui compte le plus dans une courbe de poids ?",["\xCAtre au-dessus de la moyenne","Suivre une trajectoire r\xE9guli\xE8re","Prendre le plus de poids possible"],1]},{id:"milestones",title:"Les grandes \xE9tapes",min:2,body:()=>`
      <p>Sourire, tenir sa t\xEAte, se retourner, s'asseoir, ramper, marcher, parler : chaque enfant franchit ces \xE9tapes \xE0 <b>son propre rythme</b>, avec parfois plusieurs mois d'\xE9cart entre deux enfants du m\xEAme \xE2ge.</p>
      <p>Le carnet de sant\xE9 indique, pour chaque examen m\xE9dical, les acquisitions attendues. Les examens obligatoires sont l'occasion d'en parler.</p>
      <p>Parle \xE0 ton m\xE9decin si ton enfant <b>perd</b> une comp\xE9tence qu'il avait acquise, ou si quelque chose t'inqui\xE8te dans son d\xE9veloppement : mieux vaut poser la question.</p>
      <div class="g-tip"><b>Dans Doudodo</b> Note ses \xAB premi\xE8res fois \xBB dans Souvenirs : elles deviennent des cartes \xE0 partager avec la famille.</div>`,why:"Conna\xEEtre la grande variabilit\xE9 entre enfants rassure, et savoir quand en parler au m\xE9decin permet d'agir t\xF4t si besoin.",app:["memo","Noter une premi\xE8re fois"],src:["mille"],quiz:["Deux b\xE9b\xE9s du m\xEAme \xE2ge ne marchent pas au m\xEAme moment. C'est\u2026",["Normal","Inqui\xE9tant dans tous les cas","Impossible"],0]},{id:"screens",title:"Les \xE9crans",min:2,body:()=>`
      <p>En 2024, une commission d'experts r\xE9unie \xE0 la demande du gouvernement a recommand\xE9 <b>aucun \xE9cran avant 3 ans</b>. Depuis 2025, les \xE9crans sont interdits dans les lieux d'accueil des jeunes enfants (cr\xE8ches, assistantes maternelles).</p>
      <p>Avant 3 ans, l'enfant apprend surtout par les interactions : visages, voix, jeux, manipulation d'objets. Les \xE9crans prennent la place de ces moments et peuvent g\xEAner le sommeil.</p>
      <p>\xC7a concerne aussi les \xE9crans \xAB en fond \xBB (t\xE9l\xE9vision allum\xE9e dans la pi\xE8ce) et le t\xE9l\xE9phone des parents pendant les moments d'\xE9change, comme les repas ou les t\xE9t\xE9es.</p>`,why:"Les premi\xE8res ann\xE9es sont d\xE9cisives pour le langage et l'attention. Pr\xE9server ces moments d'\xE9change est l'un des meilleurs cadeaux \xE0 faire \xE0 son enfant.",app:null,src:["ecrans","ecransCreche"],quiz:["Que recommande la commission d'experts de 2024 avant 3 ans ?",["Pas plus d'une heure par jour","Aucun \xE9cran","Seulement des dessins anim\xE9s \xE9ducatifs"],1]}]},{id:"parents",title:"Les parents aussi",ic:"heart",cls:"wake",items:[{id:"parents-mental",title:"Baby blues et d\xE9pression post-partum",min:4,key:!0,body:()=>`
      <p>Le <b>baby blues</b> touche plus d'une m\xE8re sur deux. Il appara\xEEt 2 \xE0 4 jours apr\xE8s l'accouchement et dure de quelques heures \xE0 quelques jours : tristesse, pleurs, irritabilit\xE9, sentiment d'\xEAtre d\xE9pass\xE9e. Il passe seul.</p>
      <p>La <b>d\xE9pression post-partum</b> est diff\xE9rente : des sympt\xF4mes presque tous les jours pendant au moins 2 semaines, le plus souvent entre 2 et 4 mois apr\xE8s la naissance (parfois vers 6 mois) :</p>
      <ul><li>tristesse, perte d'int\xE9r\xEAt, fatigue intense ;</li><li>difficult\xE9 \xE0 s'occuper du b\xE9b\xE9 ;</li><li>culpabilit\xE9, sentiment de ne pas \xEAtre \xE0 la hauteur, d\xE9sespoir ;</li><li>troubles du sommeil ou de l'app\xE9tit.</li></ul>
      <p><b>Les p\xE8res aussi</b> : environ 1 sur 10 vit une d\xE9pression autour de la naissance, avec parfois de l'irritabilit\xE9, une fuite dans le travail ou les \xE9crans, de l'isolement.</p>
      <div class="g-tip"><b>O\xF9 trouver de l'aide</b> Ton m\xE9decin, ta sage-femme, la PMI. L'<b>entretien postnatal pr\xE9coce</b>, entre la 4e et la 8e semaine, est pris en charge et le coparent peut y venir.</div>
      <div class="g-warn"><b>En cas d'id\xE9es noires</b> Appelle le <b>3114</b> (pr\xE9vention du suicide, 24 h/24, gratuit) ou le 15.</div>`,why:"La d\xE9pression post-partum se soigne bien, mais elle passe souvent inaper\xE7ue. En parler t\xF4t prot\xE8ge le parent, le couple et le lien avec le b\xE9b\xE9.",app:null,src:["parents"],quiz:["Un baby blues qui dure plus de 2 semaines\u2026",["Doit amener \xE0 consulter","Est toujours normal","Concerne seulement les p\xE8res"],0]},{id:"relay",title:"Se relayer et se faire aider",min:2,body:()=>`
      <p>Les premiers mois, le manque de sommeil est la norme pour les parents. Quelques id\xE9es qui aident beaucoup :</p>
      <ul><li><b>Se relayer</b> : chacun son tour la nuit ou le matin, pour garder au moins une longue p\xE9riode de sommeil.</li>
      <li><b>Dormir quand b\xE9b\xE9 dort</b>, au moins une fois par jour, plut\xF4t que de rattraper les t\xE2ches.</li>
      <li><b>Accepter l'aide</b> : un repas apport\xE9, une lessive, une heure de garde.</li>
      <li><b>Partager l'information</b> : quand tout le monde sait \xE0 quelle heure b\xE9b\xE9 a mang\xE9 et dormi, la passation est plus simple et personne ne porte tout seul la charge mentale.</li></ul>
      <div class="g-tip"><b>Dans Doudodo</b> Partage le foyer avec ton ou ta partenaire, invite la nounou ou les grands-parents, et envoie le r\xE9cap de la journ\xE9e en un appui.</div>`,why:"Des parents moins \xE9puis\xE9s sont plus patients et plus disponibles. Prendre soin de soi, c'est aussi prendre soin de son enfant.",app:["set","Partager le foyer ou inviter quelqu'un"],src:["mille"],quiz:["Quelle id\xE9e aide le plus \xE0 limiter l'\xE9puisement les premiers mois ?",["Ne jamais se faire aider","Se relayer la nuit","Supprimer les siestes de b\xE9b\xE9"],1]},{id:"how-doudodo",title:"Comment Doudodo calcule ses conseils",min:3,body:()=>`
      <p>Doudodo part de <b>rep\xE8res selon l'\xE2ge</b> (temps d'\xE9veil, nombre et dur\xE9e des siestes, voir l'article sur le temps d'\xE9veil), puis les ajuste avec ce que tu notes :</p>
      <ul><li>il regarde les <b>3 derni\xE8res semaines</b>, en donnant plus de poids aux jours r\xE9cents ;</li>
      <li>il distingue chaque sieste de la journ\xE9e : la premi\xE8re fen\xEAtre d'\xE9veil est souvent plus courte, la derni\xE8re plus longue ;</li>
      <li>apr\xE8s une sieste courte, il raccourcit un peu l'\xE9veil suivant ; apr\xE8s une longue sieste, il l'allonge un peu ;</li>
      <li>il ignore les <b>journ\xE9es particuli\xE8res</b> (maladie, voyage, vaccin) que tu signales ;</li>
      <li>quand le rythme change (une sieste de moins pendant 3 jours), il propose de s'adapter tout de suite.</li></ul>
      <p>Plus tu notes de siestes, plus ses cr\xE9neaux ressemblent \xE0 ton enfant : apr\xE8s une dizaine de jours, ils deviennent vraiment personnalis\xE9s.</p>
      <p class="g-small">Doudodo donne des rep\xE8res, pas des r\xE8gles. Si ton enfant montre des signes de fatigue avant le cr\xE9neau, couche-le : c'est lui qui a raison.</p>`,why:"Comprendre d'o\xF9 viennent les cr\xE9neaux aide \xE0 leur faire confiance\u2026 et \xE0 savoir quand s'en \xE9carter.",app:["stats","Voir ce que Doudodo a appris"],src:[],quiz:["Ton b\xE9b\xE9 se frotte les yeux 20 minutes avant le cr\xE9neau conseill\xE9. Que faire ?",["Attendre le cr\xE9neau","Le coucher : ses signes de fatigue priment","Le stimuler pour le garder \xE9veill\xE9"],1]}]}],Q=zs.flatMap(e=>e.items.map(t=>({...t,ch:e}))),Vs=()=>i.settings.read||{};let st=null;function ne(e,t){return`<button class="g-link" data-act="guide" data-a="${e}">${T("book")}<span>${t}</span></button>`}function Sa(){if(st){const s=Q.find(r=>r.id===st);if(s)return ja(s)}const e=Vs(),t=Q.filter(s=>e[s.id]).length,n=Math.round(100*t/Q.length),a=Q.find(s=>!e[s.id]);return`<h1>Guide</h1><p class="sub">Comprendre le sommeil, les repas et la sant\xE9 de ${w(H())}, \xE0 ton rythme. Des articles courts, v\xE9rifi\xE9s aupr\xE8s de sources officielles.</p>

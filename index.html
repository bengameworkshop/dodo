<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1766">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doudodo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Doudodo - sommeil de bébé</title>
<style>
:root{
  --bg:#120a29; --card:#1d1340; --raised:#2a1c59; --text:#f5f0ff; --muted:#b5a9da; --line:#34266c;
  --accent:#b89cff; --on-accent:#1b0f3d; --accent-soft:#2f2066; --glow:rgba(150,110,255,.35);
  --sleep:#cdb8ff; --night:#6c48de; --meal:#ff7fbf; --pee:#5cc9f0; --poop:#cf9c78; --wake:#dd8bff; --med:#4fd6a4; --temp:#ff7f8f; --note:#a3aed6;
  --late:#ff7f9b; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f2ff; --card:#ffffff; --raised:#efe8ff; --text:#1f1440; --muted:#62577f; --line:#e6defa;
  --accent:#6a3be0; --on-accent:#ffffff; --accent-soft:#ece4ff; --glow:rgba(106,59,224,.28);
  --sleep:#7450e8; --night:#43239f; --meal:#d6408c; --pee:#1293c4; --poop:#8f5f3e; --wake:#b54fdc; --med:#16946a; --temp:#de4458; --note:#64719a;
  --late:#d23a5c; color-scheme:light;
}
@media (prefers-color-scheme:light){
  :root[data-theme="auto"]{
  --bg:#f6f2ff; --card:#ffffff; --raised:#efe8ff; --text:#1f1440; --muted:#62577f; --line:#e6defa;
  --accent:#6a3be0; --on-accent:#ffffff; --accent-soft:#ece4ff; --glow:rgba(106,59,224,.28);
  --sleep:#7450e8; --night:#43239f; --meal:#d6408c; --pee:#1293c4; --poop:#8f5f3e; --wake:#b54fdc; --med:#16946a; --temp:#de4458; --note:#64719a;
  --late:#d23a5c; color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
body{background:radial-gradient(90% 40% at 100% 0%,var(--glow),transparent 70%) no-repeat,var(--bg);min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1{font-size:26px;line-height:1.15;margin:6px 0 4px;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;margin:26px 0 6px;font-weight:800}
.sub,.hint{color:var(--muted);font-size:15px;margin:0 0 12px}
.note{font-size:14px;color:var(--muted);line-height:1.45}
.card,.learn,.tile,.warn{background:var(--card);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 28px -22px var(--glow)}
.card{border-radius:20px;padding:16px;margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:15px}

.top{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.top svg{width:48px;height:48px;border-radius:14px;flex:none;box-shadow:0 6px 18px -4px var(--glow)}
.top .brand{font-size:22px;font-weight:800;line-height:1.1}
.top .who{color:var(--muted);font-size:15px}

/* Carte de prédiction : ciel violet, lune en halo */
.sky{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:20px 18px 18px;margin-bottom:12px;
  background:radial-gradient(70% 60% at 100% 0%,rgba(214,190,255,.55),transparent 60%),linear-gradient(160deg,#8556f5,#5a2bd0 55%,#35147f);
  box-shadow:0 18px 40px -18px rgba(90,43,208,.75),inset 0 1px 0 rgba(255,255,255,.25)}
.sky::before{content:"";position:absolute;right:-48px;top:-62px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff,#e9dcff 60%,rgba(233,220,255,0) 72%);opacity:.5;box-shadow:0 0 60px 24px rgba(255,255,255,.28);pointer-events:none}
.sky::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(1.5px 1.5px at 62% 18%,#fff,transparent 60%),radial-gradient(1.5px 1.5px at 48% 9%,#fff,transparent 60%),radial-gradient(1px 1px at 30% 15%,#fff,transparent 60%),radial-gradient(1px 1px at 74% 34%,#fff,transparent 60%);opacity:.8}
.sky > *{position:relative;z-index:1}
.sky .lead{font-size:16px;color:#e4d9ff;margin:0;max-width:78%}
.sky .time{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 10px;text-shadow:0 0 26px rgba(255,255,255,.35)}
.sky .time.small{font-size:28px;text-shadow:none;max-width:85%}
.sky .why{color:#d5c8f7;font-size:14px;margin:12px 0 0}
.state{display:inline-block;padding:5px 12px;border-radius:99px;font-size:15px;font-weight:700;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.2)}
.state.now{background:#fff;color:#4a1fb8;box-shadow:0 0 22px rgba(255,255,255,.55)}
.state.late{background:#ffd3e0;color:#7a0f33;border-color:transparent}
.path{position:relative;height:34px;margin:18px 12px 4px}
.path .rail{position:absolute;left:-12px;right:-12px;top:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.path .zone{position:absolute;top:8px;height:18px;border-radius:9px;background:rgba(255,255,255,.22);border:2px solid #fff;box-shadow:0 0 14px rgba(255,255,255,.45)}
.path .done{position:absolute;overflow:hidden;left:-12px;top:14px;height:6px;border-radius:3px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7)}
.path .me{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.2),0 0 20px 8px rgba(255,255,255,.6)}
.ends{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#d5c8f7;margin-bottom:2px}
.cta{display:block;width:100%;margin-top:16px;padding:14px 16px;border-radius:18px;background:linear-gradient(180deg,#fff,#efe6ff);color:#4a1fb8;text-align:center;box-shadow:0 12px 28px -10px rgba(255,255,255,.55),inset 0 -2px 0 rgba(106,59,224,.14)}
.cta b{display:block;font-size:19px;font-weight:800}
.cta small{display:block;font-size:14px;opacity:.8;margin-top:1px}
.cta:active,.btn:active,.tile:active,.chip:active{transform:scale(.98)}
.ghosts{display:flex;gap:8px;margin-top:8px}
.ghost{flex:1;padding:11px 8px;border-radius:14px;text-align:center;color:#f1eaff;font-size:15px;font-weight:600;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07)}

.warn{display:flex;gap:12px;align-items:center;border-radius:20px;padding:14px 16px;margin-bottom:12px;border-color:var(--late)}
.warn div{flex:1}.warn b{display:block}.warn small{color:var(--muted);font-size:14px}
.warn .btn{width:auto;margin:0;padding:10px 16px}
.warn.install{border-color:var(--accent);box-shadow:0 0 22px -6px var(--glow)}

.learn{border-radius:20px;padding:14px 16px;margin-bottom:12px}
.learn .head{display:flex;align-items:center;gap:10px}
.learn .head b{flex:1;font-size:16px}
.learn .pct{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--raised);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;position:relative;overflow:hidden;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),#c9a8ff);box-shadow:0 0 10px var(--glow)}
.learn.done{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}

.tile{display:flex;align-items:center;gap:12px;width:100%;border-radius:18px;padding:12px 14px;margin-bottom:8px}
.tile .tx{flex:1;min-width:0}
.tile b{display:block;font-size:17px;font-weight:800}
.tile small{display:block;color:var(--muted);font-size:14px}
.tile .plus{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:22px;font-weight:700;line-height:1}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.tiles3 .tile{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 4px;margin:0}
.tiles3 .tile b{font-size:15px}
.ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ic svg{width:22px;height:22px;fill:currentColor;fill-opacity:.2;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.two{display:flex;justify-content:center;gap:0}.ic.two svg{width:17px;height:17px;margin:0 -1px}
.ic.sleep{--c:var(--sleep)}.ic.night{--c:var(--night)}.ic.meal{--c:var(--meal)}.ic.pee{--c:var(--pee)}.ic.poop{--c:var(--poop)}.ic.wake{--c:var(--wake)}.ic.med{--c:var(--med)}.ic.temp{--c:var(--temp)}.ic.note{--c:var(--note)}.ic.growth{--c:var(--accent)}

/* Frise 0 h - 24 h */
.tl{position:relative;margin-top:4px}
.trk{position:relative;height:16px}
.trk.mid{height:28px;background:var(--raised);border-radius:9px;overflow:hidden}
.trk .nap,.trk .ngt,.trk .pred{position:absolute;top:4px;bottom:4px;min-width:4px;border-radius:5px}
.trk .nap{background:var(--sleep)}
.trk .ngt{background:var(--night)}
.trk .pred{top:3px;bottom:3px;min-width:6px;border:2px dashed var(--sleep)}
.trk .dot{position:absolute;top:3px;width:10px;height:10px;margin-left:-5px;border-radius:50%}
.tl .nowline{position:absolute;top:0;height:60px;width:2px;margin-left:-1px;background:var(--late);border-radius:1px;box-shadow:0 0 8px var(--late)}
.axis{position:relative;height:18px;margin-top:2px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.blk{width:16px;border-radius:4px}
.legend i.dash{width:16px;border-radius:4px;border:2px dashed var(--sleep);background:none}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.totals b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.totals span{font-size:13px;color:var(--muted)}
.wk{display:grid;grid-template-columns:58px 1fr;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.wk .trk.mid{height:22px}
.wk .tick{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--meal);opacity:.85}

/* Graphiques en barres */
.bars{display:flex;gap:6px;align-items:flex-end;margin-top:6px}
.bcol{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted)}
.barea{position:relative;height:120px;margin-top:18px}
.bstack{position:absolute;left:18%;right:18%;bottom:0;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;min-height:2px;background:var(--raised)}
.bstack i{display:block}
.bval{position:absolute;left:0;right:0;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

.rows{padding:2px 6px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 6px}
.row .d{flex:1;min-width:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.row .d small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.row .d small.bad{color:var(--late);font-weight:700}
.row .t{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.row .edit{color:var(--accent);font-size:14px;font-weight:700}
.more{display:block;width:100%;text-align:center;padding:12px;color:var(--accent);font-weight:700}

.btn{display:block;width:100%;padding:15px;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:var(--on-accent);font-weight:800;font-size:17px;margin-top:12px;text-align:center;box-shadow:0 10px 22px -12px var(--accent)}
.btn.sec{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.danger{background:color-mix(in srgb,var(--late) 15%,transparent);color:var(--late);box-shadow:none}
.btn.small{padding:12px;font-size:16px;margin-top:8px}

nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:140px;padding:9px 0 8px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button span{padding:3px 14px;border-radius:99px;display:grid}
nav button.on{color:var(--accent);font-weight:800}
nav button.on span{background:var(--accent-soft);box-shadow:0 0 14px var(--glow)}

.datenav{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
.datenav button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;color:var(--accent)}
.datenav button:disabled{opacity:.35}
.datenav .lbl{font-weight:800;text-align:center;flex:1;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 4px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:13px}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}

.overlay{position:fixed;inset:0;background:rgba(14,6,36,.62);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 -10px 40px -10px var(--glow)}
.sheet h3{margin:0 0 12px;font-size:21px;font-weight:800}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 5px;font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea,select{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:30%;padding:11px 6px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:15px;text-align:center}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 6px 16px -8px var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:9px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px}
.chip.on{background:var(--accent);color:var(--on-accent)}
.stepper{display:flex;gap:8px;align-items:center}
.stepper button{width:52px;height:52px;flex:none;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:24px;font-weight:800;text-align:center}
.stepper input{text-align:center;font-size:22px;font-weight:800}
.switch{display:flex;align-items:center;gap:12px}.switch div{flex:1}.switch b{display:block}
.switch button{flex:none;width:58px;height:34px;border-radius:17px;background:var(--raised);position:relative;border:1px solid var(--line)}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .15s}
.switch button.on{background:var(--accent);box-shadow:0 0 14px var(--glow)}.switch button.on::after{left:27px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#2a1766;color:#fff;padding:13px 16px;border-radius:16px;z-index:30;display:flex;gap:14px;align-items:center;font-size:15px;font-weight:600;box-shadow:0 10px 30px -6px rgba(60,20,150,.7);width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;border:1px solid rgba(255,255,255,.16)}
.toast button{color:#d9c8ff;font-weight:800}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:16px;letter-spacing:.03em;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
/* Horloge de la journée */
.clock{max-width:300px;margin:0 auto}
.clock svg{display:block;width:100%;height:auto;overflow:visible}
.ctrack{fill:none;stroke:var(--raised);stroke-width:26}
.cnap,.cngt,.cpred{fill:none;stroke-width:26}
.cnap{stroke:var(--sleep)}
.cngt{stroke:var(--night)}
.cpred{stroke:var(--sleep);stroke-opacity:.45;stroke-dasharray:3 3}
.live{animation:breathe 2.6s ease-in-out infinite;filter:drop-shadow(0 0 7px var(--sleep))}
@keyframes breathe{50%{stroke-opacity:.5}}
.ctick{stroke:var(--muted);stroke-width:1.5;opacity:.45;stroke-linecap:round}
.ctick.major{stroke-width:2.5;opacity:.8}
.clab{fill:var(--muted);font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.cnow{stroke:var(--late);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--late))}
.cbig{fill:var(--text);font-size:30px;font-weight:800;text-anchor:middle;font-variant-numeric:tabular-nums}
.csmall{fill:var(--muted);font-size:13px;text-anchor:middle}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--sleep) 0 3px,transparent 3px 6px);border:none;opacity:.7}
.more.left{text-align:left;padding:2px 0 4px;width:auto}

/* Sommeil en cours : « z » qui s'envolent, lune qui respire */
.sky .zzz{position:absolute;right:34px;top:16px;width:40px;height:80px;z-index:2;pointer-events:none}
.zzz span{position:absolute;right:0;bottom:0;opacity:0;color:#fff;font-weight:800;font-size:18px;text-shadow:0 0 12px rgba(255,255,255,.8);animation:zfloat 3.9s ease-out infinite}
.zzz span:nth-child(2){animation-delay:1.3s;font-size:23px}
.zzz span:nth-child(3){animation-delay:2.6s;font-size:28px}
@keyframes zfloat{0%{transform:translate(0,0) rotate(-8deg);opacity:0}20%{opacity:.95}100%{transform:translate(-30px,-58px) rotate(6deg);opacity:0}}
.sky.asleep::before{animation:moonglow 4.5s ease-in-out infinite}
@keyframes moonglow{50%{opacity:.8;box-shadow:0 0 80px 34px rgba(255,255,255,.38)}}
.sky.asleep .path .me{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,255,255,.12),0 0 26px 12px rgba(255,255,255,.75)}}
.toast .tx-extra{color:#fff;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.zzz span{opacity:.6}}

/* Diagnostic de synchro */
.diag{margin:12px 0 8px;border-top:1px solid var(--line)}
.diag div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.diag span{color:var(--muted)}
.diag b{text-align:right}

/* Croissance */
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 28px -22px var(--glow)}
.gcard span{color:var(--muted);font-size:14px;font-weight:700}
.gcard b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0}
.gcard small{display:block;color:var(--muted);font-size:13px}
.gcard small.tr{color:var(--text);font-weight:600;margin-top:2px}
.lchart{display:block;width:100%;height:auto;overflow:visible}
.lchart .gl{stroke:var(--line);stroke-width:1}
.lchart .gy{fill:var(--muted);font-size:11px;text-anchor:end;dominant-baseline:central}
.lchart .gx{fill:var(--muted);font-size:11px}
.lchart .lv{fill:var(--text);font-size:13px;font-weight:800;text-anchor:end}

/* Mode nuit doux : très sombre, peu lumineux, sans halo */
:root.soft{
  --bg:#06040d; --card:#0d0919; --raised:#161029; --text:#a898c9; --muted:#6c6188; --line:#1b1433;
  --accent:#8b77c4; --on-accent:#0b0716; --accent-soft:#191230; --glow:transparent;
  --sleep:#7c6bb8; --night:#4a3a8c; --meal:#a0577f; --pee:#3f7f99; --poop:#7d6250; --wake:#8a5fa0; --med:#3e8a6c; --temp:#a3515e; --note:#5e6684;
  --late:#a35068; color-scheme:dark;
}
:root.soft .sky{background:linear-gradient(160deg,#17102f,#0c0819);color:#b6a7dd;box-shadow:none}
:root.soft .sky::before{opacity:.1;box-shadow:none}
:root.soft .sky::after{opacity:.3}
:root.soft .sky .lead,:root.soft .sky .why,:root.soft .ends{color:#7f74a3}
:root.soft .sky .time{text-shadow:none}
:root.soft .state{background:rgba(255,255,255,.06);color:#b6a7dd;border-color:rgba(255,255,255,.08)}
:root.soft .state.now{background:#2c2154;color:#d5c8f7;box-shadow:none}
:root.soft .state.late{background:#3a1726;color:#d79aab}
:root.soft .cta{background:#211839;color:#c4b4f2;box-shadow:none}
:root.soft .ghost{color:#9d90c6;border-color:rgba(255,255,255,.1);background:none}
:root.soft .path .me,:root.soft .path .done{background:#9d90c6;box-shadow:none}
:root.soft .path .zone{background:rgba(255,255,255,.06);border-color:#6f62a0;box-shadow:none}
:root.soft .btn{background:var(--accent);box-shadow:none}
:root.soft .btn.sec{background:var(--accent-soft)}
:root.soft .top svg{filter:brightness(.55) saturate(.7);box-shadow:none}
:root.soft .zzz span{text-shadow:none;color:#9d90c6}
:root.soft .live,:root.soft .cnow{filter:none}
:root.soft .toast{background:#140e26;color:#c4b4f2;box-shadow:none}
:root.soft nav{background:#0b0716}
:root.soft img,:root.soft .ic{filter:saturate(.75)}

/* Confirmation : petite notification qui glisse */
.toast{animation:toastin .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes toastin{from{transform:translate(-50%,18px);opacity:0}}
.tx-ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-style:normal;font-weight:900;font-size:15px}
.tx-ic svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.tx-ic.err{background:#ff8fa3;color:#3a0010}

/* Reflet discret sur les barres de progression */
.bar i::after,.path .done::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent) no-repeat;background-size:70px 100%;animation:sheen 3.8s ease-in-out infinite}
@keyframes sheen{0%{background-position:-70px 0}55%,100%{background-position:calc(100% + 70px) 0}}
:root.soft .bar i::after,:root.soft .path .done::after{opacity:.3}

/* Le doudou vivant */
.top .dd-btn{flex:none;width:66px;height:66px;padding:0;border-radius:19px;box-shadow:0 8px 22px -6px var(--glow);cursor:pointer}
.top .dd-btn svg{width:66px;height:66px;border-radius:19px;display:block;box-shadow:none}
.say{display:inline-block;margin-top:5px;padding:4px 11px;border-radius:12px 12px 12px 4px;background:var(--accent-soft);color:var(--text);font-size:14px;font-weight:600}
.dd{overflow:visible}
.dd-body{transform-box:fill-box;transform-origin:50% 85%;animation:ddbreath 4.2s ease-in-out infinite}
.dd.asleep .dd-body{animation-duration:5.6s}
@keyframes ddbreath{50%{transform:scale(1.045)}}
.dd-eyes{transform-box:fill-box;transform-origin:center;animation:ddblink 5s infinite}
@keyframes ddblink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}
.dd-mouth{transform-box:fill-box;transform-origin:center;animation:ddyawn 5s ease-in-out infinite}
@keyframes ddyawn{0%,52%,100%{transform:scale(.55,.4)}66%,84%{transform:scale(1.1,1.35)}}
.dd-star{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.3;transform:scale(.6)}}
.dd.wiggle{animation:ddwiggle .7s ease}
@keyframes ddwiggle{15%{transform:rotate(-10deg) scale(1.08)}35%{transform:rotate(8deg)}55%{transform:rotate(-5deg)}75%{transform:rotate(2deg)}}

/* Notification de badge */
.ach{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top, 0px));transform:translateX(-50%);z-index:40;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;display:flex;gap:14px;align-items:center;padding:14px 20px 14px 14px;border-radius:22px;color:#fff;cursor:pointer;
  background:linear-gradient(150deg,#8b5cf6,#5a2bd0 60%,#3a168f);box-shadow:0 18px 40px -12px rgba(90,43,208,.85),inset 0 1px 0 rgba(255,255,255,.3);animation:achin .55s cubic-bezier(.2,.9,.3,1.25)}
.ach.out{animation:achout .35s ease forwards}
@keyframes achin{from{transform:translate(-50%,-34px) scale(.9);opacity:0}}
@keyframes achout{to{transform:translate(-50%,-34px);opacity:0}}
.ach .medal{position:relative;flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#5b2fc7;background:radial-gradient(circle at 35% 30%,#fff,#ece2ff 60%,#c9b2ff);box-shadow:0 0 24px rgba(255,255,255,.6)}
.ach .medal svg,.badge .medal svg{width:28px;height:28px;fill:currentColor;fill-opacity:.2;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ach small{display:block;font-size:13px;font-weight:700;color:#e4d9ff}
.ach b{display:block;font-size:17px;font-weight:800}
.ach .d{display:block;font-size:14px;color:#e4d9ff}
.ach .spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;opacity:0;animation:spark 1s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(-14px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-50px) scale(.3)}}
:root.soft .ach{background:linear-gradient(150deg,#2a1f55,#160f30);box-shadow:none;color:#d5c8f7}

/* Liste des badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:5px}
.badge .medal{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--muted)}
.badge .medal svg{width:22px;height:22px}
.badge.on .medal{background:radial-gradient(circle at 35% 30%,#fff,#ece2ff 60%,#c9b2ff);color:#5b2fc7;box-shadow:0 0 16px var(--glow)}
.badge b{font-size:15px;font-weight:800;line-height:1.2}
.badge:not(.on) b{color:var(--muted)}
.badge small{font-size:13px;color:var(--muted);line-height:1.3}

/* Premier lancement et tuto */
.onb{position:fixed;inset:0;z-index:60;color:#fff;overflow:auto;
  background:radial-gradient(80% 50% at 85% 0%,rgba(214,190,255,.5),transparent 60%),linear-gradient(165deg,#7b4cf0,#4a1fc0 50%,#1d0f52);
  padding:calc(12px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px))}
.onb-in{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.onb-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.onb-link{color:#ece3ff;font-weight:700;padding:10px 4px}
.onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:8px 0}
.onb-body h2{font-size:28px;line-height:1.15;margin:26px 0 10px;font-weight:800;text-wrap:balance}
.onb-body p{font-size:17px;color:#e6dcff;line-height:1.5;margin:0 auto;max-width:34ch}
.onb-body label{color:#e6dcff;text-align:left;margin-top:16px}
.onb-body input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff;color-scheme:dark}
.onb-body input::placeholder{color:rgba(255,255,255,.55)}
.onb-art{display:flex;justify-content:center;gap:14px}
.onb-medal{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;color:#5b2fc7;background:radial-gradient(circle at 35% 30%,#fff,#ece2ff 60%,#c9b2ff);box-shadow:0 0 60px 10px rgba(255,255,255,.32);animation:onbfloat 4s ease-in-out infinite}
.onb-medal svg{width:64px;height:64px;fill:currentColor;fill-opacity:.2;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dd-art svg{width:150px;height:150px;border-radius:40px;box-shadow:0 0 70px 14px rgba(255,255,255,.28);animation:onbfloat 4s ease-in-out infinite}
.tiles-art .ic{width:78px;height:78px;background:#fff;box-shadow:0 0 30px rgba(255,255,255,.35);animation:onbfloat 4s ease-in-out infinite}
.tiles-art .ic:nth-child(2){animation-delay:-1.3s}.tiles-art .ic:nth-child(3){animation-delay:-2.6s}
.tiles-art .ic svg{width:38px;height:38px}
@keyframes onbfloat{50%{transform:translateY(-8px)}}
.onb-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.onb-actions .cta{margin-top:0}
.onb-actions .ghost{flex:none;width:100%;margin:0}
.onb-dots{display:flex;justify-content:center;gap:7px;margin-top:18px}
.onb-dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.35);transition:width .2s}
.onb-dots i.on{background:#fff;width:20px}
.onb-code{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);font-size:18px;margin-top:16px}
:root.soft .onb{background:linear-gradient(165deg,#1a1236,#0b0719);color:#c9bdf0}

/* Glisser pour supprimer */
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line);max-height:220px;border-radius:12px}
.swipe:last-child{border-bottom:none}
.swipe .row{position:relative;z-index:1;background:var(--card);touch-action:pan-y;transition:transform .22s ease;user-select:none;-webkit-user-select:none}
.swipe.dragging .row{transition:none}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:18px;font-weight:800;font-size:15px;color:#fff;background:color-mix(in srgb,var(--late) 55%,var(--card));transition:background .15s}
.swipe-bg svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.swipe.armed .swipe-bg{background:var(--late)}
.swipe.gone{animation:rowgone .28s ease .2s forwards}
@keyframes rowgone{to{max-height:0;opacity:0;border-bottom-width:0}}

/* Journée particulière */
.card.atyp{padding:12px 14px}
.card.atyp.on{border-color:var(--wake);box-shadow:0 0 22px -10px var(--wake)}
.card.atyp .chips{margin-top:10px}
.atyp-dot{display:inline-block;width:8px;height:8px;margin-left:5px;border-radius:2px;transform:rotate(45deg);background:var(--wake);vertical-align:1px}
.legend .atyp-dot{margin:0 6px 0 2px}

<script>
const LOGO_SVG = "<svg viewBox=\"0 0 512 512\" aria-hidden=\"true\"><defs><linearGradient id=\"sky\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#9a6bff\"/><stop offset=\".55\" stop-color=\"#6a35e0\"/><stop offset=\"1\" stop-color=\"#3a168f\"/></linearGradient><radialGradient id=\"halo\"><stop offset=\".5\" stop-color=\"#fff\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"/></radialGradient><mask id=\"cr\"><rect width=\"512\" height=\"512\" fill=\"#000\"/><circle cx=\"256\" cy=\"272\" r=\"150\" fill=\"#fff\"/><circle cx=\"196\" cy=\"242\" r=\"150\" fill=\"#000\"/></mask></defs><rect width=\"512\" height=\"512\" fill=\"url(#sky)\"/><circle cx=\"256\" cy=\"272\" r=\"225\" fill=\"url(#halo)\"/><circle cx=\"146\" cy=\"160\" r=\"50\" fill=\"#fff\"/><circle cx=\"146\" cy=\"160\" r=\"26\" fill=\"#e6d8ff\"/><circle cx=\"366\" cy=\"160\" r=\"50\" fill=\"#e9dcff\"/><circle cx=\"366\" cy=\"160\" r=\"26\" fill=\"#cdb6ff\"/><circle cx=\"256\" cy=\"272\" r=\"150\" fill=\"#fff\"/><rect width=\"512\" height=\"512\" fill=\"#dccbff\" mask=\"url(#cr)\"/><circle cx=\"182\" cy=\"302\" r=\"16\" fill=\"#f2a3d3\" opacity=\".75\"/><circle cx=\"290\" cy=\"302\" r=\"16\" fill=\"#f2a3d3\" opacity=\".75\"/><path d=\"M188 269q16 15 33 0M251 269q16 15 33 0\" fill=\"none\" stroke=\"#5b2fc7\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M222 311q14 10 27 0\" fill=\"none\" stroke=\"#5b2fc7\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M432 68l7.840000000000001 20.16 20.16 7.840000000000001-20.16 7.840000000000001-7.840000000000001 20.16-7.840000000000001-20.16-20.16-7.840000000000001 20.16-7.840000000000001z\" fill=\"#fff\" opacity=\"1\"/><path d=\"M74 135l4.2 10.799999999999999 10.799999999999999 4.2-10.799999999999999 4.2-4.2 10.799999999999999-4.2-10.799999999999999-10.799999999999999-4.2 10.799999999999999-4.2z\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M440 397l3.6400000000000006 9.36 9.36 3.6400000000000006-9.36 3.6400000000000006-3.6400000000000006 9.36-3.6400000000000006-9.36-9.36-3.6400000000000006 9.36-3.6400000000000006z\" fill=\"#fff\" opacity=\"0.7\"/></svg>";
// <LOGIC>
const MIN = 60000, H = 3600000, DAY = 86400000;

// [âge en mois, fenêtre d'éveil moyenne (min), siestes/jour, durée sieste moyenne (min)]
// Valeurs indicatives d'après les repères courants sur le sommeil du nourrisson.
// L'appli les remplace progressivement par ce qu'elle observe chez l'enfant.
const AGE_TABLE = [
  [0,50,5,50],[1,60,5,55],[2,75,4,60],[3,90,4,60],[4,105,4,60],[5,120,3,65],
  [6,135,3,70],[8,160,3,70],[10,180,2,75],[12,195,2,80],[15,225,2,80],
  [18,270,1,90],[24,300,1,90],[36,360,1,90]
];
const RANK_FACTOR = [0.8, 1, 1, 1.1, 1.2]; // 1re fenêtre du jour plus courte, dernière plus longue
const DEFAULT_BED_CLOCK = 19.5 * 60;       // coucher du soir par défaut : 19 h 30

function startOfDay(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function ageMonths(birth, now){
  if(!birth) return 4;
  const b = new Date(birth + 'T00:00:00').getTime();
  if(isNaN(b)) return 4;
  return Math.max(0, (now - b) / (30.4375 * DAY));
}
function lerpTable(age, col){
  const t = AGE_TABLE;
  if(age <= t[0][0]) return t[0][col];
  for(let i = 1; i < t.length; i++){
    if(age <= t[i][0]){
      const a = t[i-1], b = t[i];
      return a[col] + (b[col] - a[col]) * (age - a[0]) / (b[0] - a[0]);
    }
  }
  return t[t.length-1][col];
}
function defaultWindow(age, rank){ return lerpTable(age, 1) * RANK_FACTOR[Math.min(rank,5) - 1]; }
function defaultDuration(age){ return lerpTable(age, 3); }

// Regroupe par jour : siestes, réveil du matin (saisi ou fin de nuit), coucher du soir.
function groupByDay(events){
  const m = new Map();
  const day = ds => { if(!m.has(ds)) m.set(ds, {naps: [], wake: null, bed: null}); return m.get(ds); };
  const setWake = (ts) => { const g = day(startOfDay(ts)); if(!g.wake || ts < g.wake.start) g.wake = {start: ts}; };
  for(const e of events){
    if(e.type === 'nap') day(startOfDay(e.start)).naps.push(e);
    else if(e.type === 'wake') setWake(e.start);
    else if(e.type === 'night'){
      if(e.end) setWake(e.end);
      const g = day(startOfDay(e.start - 6 * H));   // un coucher après minuit compte pour la veille
      if(!g.bed || e.start > g.bed.start) g.bed = e;
    }
  }
  for(const g of m.values()) g.naps.sort((a,b) => a.start - b.start);
  return m;
}
function wstats(arr){
  const sw = arr.reduce((s,x) => s + x.w, 0);
  if(!sw) return null;
  const mean = arr.reduce((s,x) => s + x.v * x.w, 0) / sw;
  const vr = arr.reduce((s,x) => s + x.w * (x.v - mean) ** 2, 0) / sw;
  return {mean, sd: Math.sqrt(vr), n: arr.length};
}
// Journées particulières (maladie, vaccin, voyage…) : notées par une note de type « atypical »
const atypDays = events => new Set(events.filter(e => e.type === 'note' && e.kind === 'atypical').map(e => startOfDay(e.start)));
function buildModel(events, now, age){
  const days = groupByDay(events), today = startOfDay(now), atyp = atypDays(events);
  const wins = [], durs = [], napCounts = [], bedWins = [], bedClocks = [], wakeClocks = [];
  let skipped = 0;
  for(const [ds, g] of days){
    const ago = Math.round((today - ds) / DAY);
    if(ago < 0 || ago > 21) continue;
    if(atyp.has(ds)){ if(ago > 0) skipped++; continue; }
    const w = Math.pow(0.9, ago);
    g.naps.forEach((n, i) => {
      const rank = Math.min(i + 1, 5);
      const prevEnd = i === 0 ? (g.wake ? g.wake.start : null) : g.naps[i-1].end;
      if(prevEnd != null){
        const m = (n.start - prevEnd) / MIN;
        if(m >= 20 && m <= 400) wins.push({rank, v: m, w});
      }
      if(n.end){
        const dm = (n.end - n.start) / MIN;
        if(dm >= 10 && dm <= 300) durs.push({rank, v: dm, w});
      }
    });
    if(ago >= 1 && ago <= 14 && g.naps.length > 0) napCounts.push({v: g.naps.length, w});
    if(g.bed){
      const done = g.naps.filter(n => n.end && n.end <= g.bed.start);
      const prev = done.length ? done[done.length-1].end : (g.wake ? g.wake.start : null);
      if(prev != null){ const m = (g.bed.start - prev) / MIN; if(m >= 30 && m <= 600) bedWins.push({v: m, w}); }
      bedClocks.push({v: (g.bed.start - ds) / MIN, w});
    }
    if(g.wake){ const c = (g.wake.start - ds) / MIN; if(c >= 240 && c <= 660) wakeClocks.push({v: c, w}); }
  }
  const blend = (samples, def, fallbackSd) => {
    const st = wstats(samples);
    if(!st) return {mean: def, sd: fallbackSd, n: 0, def, learned: null};
    const a = st.n / (st.n + 3);
    return {mean: a * st.mean + (1 - a) * def, sd: st.n >= 3 ? st.sd : fallbackSd, n: st.n, def, learned: st.mean};
  };
  const nc = wstats(napCounts), bc = wstats(bedClocks), wc = wstats(wakeClocks);
  return {
    age,
    window: rank => blend(wins.filter(s => s.rank === Math.min(rank,5)), defaultWindow(age, rank), 15),
    duration: rank => blend(durs.filter(s => s.rank === Math.min(rank,5)), defaultDuration(age), 15),
    bed: blend(bedWins, lerpTable(age, 1) * 1.2, 20),
    bedClock: bc && bc.n >= 3 ? {mean: bc.mean, n: bc.n} : {mean: DEFAULT_BED_CLOCK, n: 0},
    wakeClock: wc && wc.n >= 3 ? wc.mean : null,
    typicalNaps: nc && nc.n >= 3 ? Math.max(1, Math.round(nc.mean)) : Math.round(lerpTable(age, 2)),
    skipped
  };
}
function findOpen(events, type, now, maxHours){
  let best = null;
  for(const e of events)
    if(e.type === type && !e.end && e.start <= now && now - e.start < maxHours * H && (!best || e.start > best.start)) best = e;
  return best;
}
function predict(events, now, birth){
  const age = ageMonths(birth, now);
  const model = buildModel(events, now, age);
  const night = findOpen(events, 'night', now, 18);
  if(night){
    let wakeAt = null;
    if(model.wakeClock != null){ wakeAt = startOfDay(night.start) + model.wakeClock * MIN; if(wakeAt <= night.start) wakeAt += DAY; }
    return {state: 'night', age, since: night.start, id: night.id, wakeAt};
  }
  const g = groupByDay(events).get(startOfDay(now)) || {naps: [], wake: null};
  const open = findOpen(events, 'nap', now, 12);
  if(open){
    const rank = Math.max(1, g.naps.indexOf(open) + 1);
    const d = model.duration(rank);
    return {state: 'sleeping', age, since: open.start, id: open.id, rank, wakeAt: open.start + d.mean * MIN, dur: d};
  }
  const done = g.naps.filter(n => n.end && n.end <= now);
  let ref = null;
  if(done.length) ref = done[done.length-1].end;
  if(g.wake && g.wake.start <= now) ref = ref == null ? g.wake.start : Math.max(ref, g.wake.start);
  if(ref == null) return {state: 'noref', age};
  const rank = done.length + 1, w = model.window(rank);
  let mean = w.mean, adjMin = 0, basis = w;
  if(done.length){
    // Après une sieste plus courte (ou plus longue) que d'habitude, la fenêtre d'éveil est raccourcie (ou allongée).
    const last = done[done.length-1], usual = model.duration(done.length).mean;
    const f = Math.min(1.12, Math.max(0.8, 1 + 0.3 * ((last.end - last.start) / MIN / usual - 1)));
    adjMin = Math.round(mean * f - mean); mean *= f;
  }
  let center = ref + mean * MIN;
  const bedTs = startOfDay(now) + model.bedClock.mean * MIN;
  const bedtime = center > bedTs - 45 * MIN || (rank > model.typicalNaps && center > bedTs - 150 * MIN);
  if(bedtime){
    basis = model.bed; adjMin = 0;
    center = ref + basis.mean * MIN;
    if(model.bedClock.n >= 3) center = (center + bedTs) / 2;
  }
  const spread = Math.min(25, Math.max(10, basis.sd * 0.8)) * MIN;
  return {state: 'awake', age, ref, rank, center, from: center - spread, to: center + spread,
    bedtime, typicalNaps: model.typicalNaps, w: basis, adjMin};
}
// Fiabilité : pour chaque sieste passée, on recalcule ce que l'appli aurait conseillé avec les seules données d'avant.
function accuracy(events, now, birth){
  const atyp = atypDays(events);
  const naps = events.filter(e => e.type === 'nap' && e.start < now && e.start > now - 10 * DAY && !atyp.has(startOfDay(e.start))).sort((a,b) => b.start - a.start).slice(0, 30);
  let n = 0, sum = 0, hit = 0;
  for(const nap of naps){
    const p = predict(events.filter(e => e.start < nap.start), nap.start - 1, birth);
    if(p.state !== 'awake' || p.bedtime) continue;
    n++; sum += Math.abs(nap.start - p.center) / MIN;
    if(nap.start >= p.from && nap.start <= p.to) hit++;
  }
  return n ? {n, mae: sum / n, hit: Math.round(100 * hit / n)} : {n: 0};
}

    <button class="cta" data-act="wake"><b>À l'instant</b><small>Enregistre le réveil à l'heure actuelle</small></button>
    <div class="ghosts"><button class="ghost" data-act="add" data-type="wake" data-lock="1">Plus tôt, choisir l'heure</button></div></section>`;

// Frise d'une journée de 0 h à 24 h : sommeil au centre, repas au-dessus, couches en dessous.
function trackParts(ds, p){
  const now = Date.now(), isToday = ds === startOfDay(now);
  const x = t => 100 * (Math.min(ds + DAY, Math.max(ds, t)) - ds) / DAY;
  const blk = (cls, a, b) => `<i class="${cls}" style="left:${x(a).toFixed(2)}%;width:${Math.max(0, x(b) - x(a)).toFixed(2)}%"></i>`;
  const dot = (t, c) => `<i class="dot" style="left:${x(t).toFixed(2)}%;background:var(--${c})"></i>`;
  let top = '', mid = '', bot = '', ticks = '';
  for(const e of S.events){
    if(e.type === 'nap' || e.type === 'night'){
      const end = e.end || (now - e.start < 18 * H ? now : e.start + 30 * MIN);
      if(e.start < ds + DAY && end > ds) mid += blk(e.type === 'nap' ? 'nap' : 'ngt', e.start, end);
    } else if(e.start >= ds && e.start < ds + DAY){
      if(e.type === 'bottle'){ top += dot(e.start, 'meal'); ticks += `<i class="tick" style="left:${x(e.start).toFixed(2)}%"></i>`; }
      else if(e.type === 'diaper') bot += dot(e.start, e.kind === 'pee' ? 'pee' : 'poop');
    }
  }
  if(isToday && p && p.state === 'awake') mid += blk('pred', p.from, p.to);
  return {top, mid, bot, ticks, nowX: isToday ? x(now).toFixed(2) : null};
}
const AXIS = '<div class="axis">' + [0,4,8,12,16,20,24].map(h => `<span style="left:${(100 * h / 24).toFixed(2)}%">${h}h</span>`).join('') + '</div>';
// Journée en cercle, comme une horloge de 24 h : minuit en haut, midi en bas.
const CX = 150;
const polar = (r, a) => { const t = (a - 90) * Math.PI / 180; return [CX + r * Math.cos(t), CX + r * Math.sin(t)]; };
function arcPath(r, a0, a1){
  a1 = Math.min(a1, a0 + 359.9);
  const [x0, y0] = polar(r, a0), [x1, y1] = polar(r, a1);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function clockHTML(ds, p){
  const now = Date.now(), isToday = ds === startOfDay(now);
  const ang = t => 360 * (Math.min(ds + DAY, Math.max(ds, t)) - ds) / DAY;
  let arcs = '', dots = '', meals = 0, diapers = 0;
  for(const e of S.events){
    if(e.type === 'nap' || e.type === 'night'){
      const open = !e.end && now - e.start < (e.type === 'nap' ? 12 : 18) * H;
      const end = e.end || (open ? now : e.start + 30 * MIN);
      if(e.start >= ds + DAY || end <= ds) continue;
      const a0 = ang(e.start), a1 = Math.max(ang(end), a0 + 1.5);
      arcs += `<path d="${arcPath(112, a0, a1)}" class="${e.type === 'nap' ? 'cnap' : 'cngt'}${open ? ' live' : ''}"/>`;
    } else if(e.start >= ds && e.start < ds + DAY){
      if(e.type === 'bottle'){ const [x, y] = polar(139, ang(e.start)); dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="var(--meal)"/>`; meals++; }
      else if(e.type === 'diaper'){ const [x, y] = polar(86, ang(e.start)); dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(--${e.kind === 'pee' ? 'pee' : 'poop'})"/>`; diapers++; }
    }
  }
  if(isToday && p && p.state === 'awake') arcs += `<path d="${arcPath(112, ang(p.from), ang(p.to))}" class="cpred"/>`;
  let marks = '';
  for(let h = 0; h < 24; h++){
    const [x0, y0] = polar(h % 6 ? 126 : 125, h * 15), [x1, y1] = polar(h % 6 ? 129 : 131, h * 15);
    marks += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" class="ctick${h % 6 ? '' : ' major'}"/>`;
  }
  for(let h = 0; h < 24; h += 3){ const [x, y] = polar(70, h * 15); marks += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="clab">${h}h</text>`; }
  let hand = '';
  if(isToday){
    const a = ang(now), [x0, y0] = polar(97, a), [x1, y1] = polar(131, a);
    hand = `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" class="cnow"/><circle cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" r="4" fill="var(--late)"/>`;
  }
  const sl = sleepInDay(ds, now), tot = sl.nap + sl.night;
  const label = `Journée de 0 h à 24 h : ${tot ? fmtD(tot) : 'pas encore'} de sommeil, ${meals} repas, ${diapers} couche${diapers > 1 ? 's' : ''}`;
  return `<div class="clock"><svg viewBox="0 0 300 300" role="img" aria-label="${esc(label)}">
      <circle cx="150" cy="150" r="112" class="ctrack"/>${arcs}${marks}${dots}${hand}
      <text x="150" y="146" class="cbig">${tot ? fmtD(tot) : '0 min'}</text><text x="150" y="170" class="csmall">de sommeil</text></svg></div>
    <div class="legend"><span><i class="blk" style="background:var(--night)"></i>Nuit</span><span><i class="blk" style="background:var(--sleep)"></i>Sieste</span>${isToday ? '<span><i class="dash"></i>Sieste prévue</span>' : ''}<span><i style="background:var(--meal)"></i>Repas (bord)</span><span><i style="background:var(--pee)"></i>Pipi</span><span><i style="background:var(--poop)"></i>Caca (centre)</span></div>`;
}
// Sommeil compris dans la journée (les nuits sont découpées à minuit).
function sleepInDay(ds, now){
  let nap = 0, night = 0;
  for(const e of S.events){
    if(e.type !== 'nap' && e.type !== 'night') continue;
    const end = e.end || (now - e.start < 18 * H ? now : e.start);
    const d = Math.min(end, ds + DAY) - Math.max(e.start, ds);
    if(d > 0){ if(e.type === 'nap') nap += d; else night += d; }
  }
  return {nap: nap / MIN, night: night / MIN};
}

  return `<div class="totals">
    <div><b>${sl.nap ? fmtD(sl.nap) : '0'}</b><span>${naps} sieste${naps > 1 ? 's' : ''}</span></div>
    <div><b>${meals.length}</b><span>repas${ml ? ', ' + ml + ' ml' : ''}</span></div>
    <div><b>${dp.length}</b><span>couche${dp.length > 1 ? 's' : ''}</span></div></div>`;
}

function statsHTML(){

  const week = days.map(ds => { const t = trackParts(ds, null); return `<span>${esc(lbl(ds))}${atypMarker(ds) ? '<i class="atyp-dot" title="Journée particulière"></i>' : ''}</span><div class="trk mid">${t.mid}${t.ticks}</div>`; }).join('');

let toastTimer;
function toast(msg, undo, extra, kind){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<i class="tx-ic${kind === 'error' ? ' err' : ''}" aria-hidden="true">${kind === 'error' ? '!' : '<svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg>'}</i><span>${esc(msg)}</span>${extra ? `<button class="tx-extra">${esc(extra.label)}</button>` : ''}${undo ? '<button class="tx-undo">Annuler</button>' : ''}`;
  if(extra) t.querySelector('.tx-extra').onclick = () => { t.remove(); extra.fn(); };
  if(undo) t.querySelector('.tx-undo').onclick = () => { undo(); t.remove(); fb('undo'); render(); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), extra ? 7000 : 5000);
}

// ---------- Fenêtre de saisie (ajout / correction) ----------
function closeModal(){ document.querySelectorAll('.overlay').forEach(o => o.remove()); render(); }
function fillDefaults(d){
  if(d.type === 'bottle'){ if(!['bottle', 'breast', 'solid'].includes(d.kind)) d.kind = 'bottle'; }
  if(d.type === 'diaper' && !['pee', 'poop', 'both'].includes(d.kind)) d.kind = 'pee';
  if(d.type === 'temp' && typeof d.val !== 'number') d.val = 37;
}
function openEditor(id, preset){
  preset = preset || {};
  const existing = id ? S.events.find(e => e.id === id) : null;
  if(id && !existing) return;
  const base = preset.day ? Math.min(Date.now(), preset.day + 12 * H) : Date.now();
  const d = existing ? {...existing} : {type: preset.type || 'nap', start: base, end: null};
  fillDefaults(d);
  if(d.type === 'note') d.atyp = !!atypMarker(startOfDay(d.start));

  ov.addEventListener('click', ev => { if(ev.target === ov) closeModal(); });
  const q = s => ov.querySelector(s);
  const sync = () => {
    if(q('#f_start') && q('#f_start').value) d.start = fromInput(q('#f_start').value);
    if(q('#f_end')) d.end = q('#f_end').value ? fromInput(q('#f_end').value) : null;
    if(q('#f_ml')) d.ml = Math.max(0, parseInt(q('#f_ml').value) || 0);
    if(q('#f_min')) d.val = Math.max(0, parseInt(q('#f_min').value) || 0);
    if(q('#f_val')) d.val = parseFloat(String(q('#f_val').value).replace(',', '.'));
    if(q('#f_note')) d.note = q('#f_note').value.trim();
    const num = id => { const v = q(id).value.trim().replace(',', '.'); return v === '' ? null : parseFloat(v); };
    if(q('#f_w')){ d.w = num('#f_w'); d.h = num('#f_h'); d.hc = num('#f_hc'); }
  };
  const seg = (attr, opts, cur) => `<div class="seg">${opts.map(([k, l]) => `<button data-${attr}="${k}" class="${cur === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const draw = () => {
    const t = d.type, noteLabel = t === 'med' ? 'Nom et dose' : t === 'note' ? 'Ta note' : t === 'bottle' && d.kind === 'solid' ? 'Ce qui a été mangé (facultatif)' : 'Note (facultatif)';
    let f = '';
    if(SPAN[t]) f += `<label>Fin (vide si ${t === 'nwake' ? 'inconnue' : 'en cours'})</label><input type="datetime-local" id="f_end" value="${d.end ? toInput(d.end) : ''}">`;
    if(t === 'bottle'){
      f += '<label>Type de repas</label>' + seg('k', [['bottle', 'Biberon'], ['breast', 'Tétée'], ['solid', 'Solide']], d.kind);
      if(d.kind === 'bottle') f += `<label>Quantité en ml (facultatif)</label><div class="stepper"><button data-ml="-10" aria-label="Moins 10 ml">−</button><input type="number" id="f_ml" inputmode="numeric" value="${d.ml || ''}" placeholder="non précisée"><button data-ml="10" aria-label="Plus 10 ml">+</button></div>
        <div class="chips">${[60,90,120,150,180,210,240].map(v => `<button class="chip${d.ml === v ? ' on' : ''}" data-q="${v}">${v} ml</button>`).join('')}</div>`;
      if(d.kind === 'breast') f += '<label>Côté</label>' + seg('side', [['left', 'Gauche'], ['right', 'Droit'], ['both', 'Les deux']], d.side)
        + `<label>Durée en minutes (facultatif)</label><input type="number" id="f_min" inputmode="numeric" value="${d.val || ''}" placeholder="par exemple 15">`;
    }
    if(t === 'diaper') f += '<label>Contenu</label>' + seg('k', [['pee', 'Pipi'], ['poop', 'Caca'], ['both', 'Les deux']], d.kind);
    if(t === 'temp') f += `<label>Température (°C)</label><div class="stepper"><button data-tv="-0.1" aria-label="Moins 0,1">−</button><input type="number" id="f_val" inputmode="decimal" step="0.1" value="${d.val}"><button data-tv="0.1" aria-label="Plus 0,1">+</button></div>`;
    if(t === 'growth') f += `<p class="note" style="margin:12px 0 0">Remplis seulement ce qui a été mesuré.</p>
      <label>Poids en kg</label><input type="text" id="f_w" inputmode="decimal" value="${d.w != null ? fmtNum(d.w, 3) : ''}" placeholder="par exemple 6,24">
      <label>Taille en cm</label><input type="text" id="f_h" inputmode="decimal" value="${d.h != null ? fmtNum(d.h, 1) : ''}" placeholder="par exemple 62,5">
      <label>Périmètre crânien en cm</label><input type="text" id="f_hc" inputmode="decimal" value="${d.hc != null ? fmtNum(d.hc, 1) : ''}" placeholder="par exemple 41">`;
    if(t === 'note') f += `<label>Notes rapides</label><div class="chips">${QUICK_NOTES.map(x => `<button class="chip${noteParts(d.note).includes(x) ? ' on' : ''}" data-qn="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
    f += `<label>${noteLabel}</label>` + (t === 'note' ? `<textarea id="f_note" maxlength="500">${esc(d.note || '')}</textarea>` : `<input type="text" id="f_note" maxlength="300" value="${esc(d.note || '')}"${t === 'med' ? ' placeholder="par exemple Doliprane 2,4 %, dose 6 kg"' : ''}>`);
    if(t === 'note') f += `<div class="switch" style="margin-top:14px"><div><b>Journée particulière</b><span class="note">Elle ne comptera pas dans l'apprentissage du rythme.</span></div>
      <button class="${d.atyp ? 'on' : ''}" data-atyp="1" role="switch" aria-checked="${!!d.atyp}" aria-label="Journée particulière"></button></div>`;
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>${existing ? 'Corriger : ' + TYPE_LABEL[t].toLowerCase() : SHEET_TITLE[t]}</h3>
      ${existing || preset.lock ? '' : seg('t', Object.entries(TYPE_LABEL), t)}
      <label>${SPAN[t] ? (t === 'night' ? 'Coucher' : 'Début') : t === 'growth' ? 'Date de la mesure' : 'Heure'}</label><input type="datetime-local" id="f_start" value="${toInput(d.start)}">
      ${f}
      <button class="btn" id="f_save">${existing ? 'Enregistrer la correction' : 'Enregistrer'}</button>
      ${existing ? '<button class="btn danger small" id="f_del">Supprimer cet évènement</button>' : ''}
      <button class="btn sec small" id="f_cancel">Fermer sans enregistrer</button></div>`;
    ov.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { sync(); d.type = b.dataset.t; d.kind = undefined; fillDefaults(d); draw(); });
    ov.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { sync(); d.kind = b.dataset.k; draw(); });
    ov.querySelectorAll('[data-side]').forEach(b => b.onclick = () => { sync(); d.side = b.dataset.side; draw(); });
    ov.querySelectorAll('[data-qn]').forEach(b => b.onclick = () => {
      sync(); const x = b.dataset.qn, parts = noteParts(d.note), on = parts.includes(x);
      d.note = (on ? parts.filter(p => p !== x) : parts.concat(x)).join(', ');
      if(!on && ATYP_AUTO.includes(x)) d.atyp = true;
      fb('tap'); draw();
    });
    ov.querySelectorAll('[data-atyp]').forEach(b => b.onclick = () => { sync(); d.atyp = !d.atyp; fb('tap'); draw(); });
    ov.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { sync(); d.ml = +b.dataset.q; draw(); });
    ov.querySelectorAll('[data-ml]').forEach(b => b.onclick = () => { sync(); d.ml = d.ml ? Math.max(0, d.ml + parseInt(b.dataset.ml)) : lastMl(); draw(); });
    ov.querySelectorAll('[data-tv]').forEach(b => b.onclick = () => { sync(); d.val = Math.round(((d.val || 37) + parseFloat(b.dataset.tv)) * 10) / 10; q('#f_val').value = d.val; });
    q('#f_cancel').onclick = closeModal;
    if(existing) q('#f_del').onclick = () => { if(confirm('Supprimer cet évènement ?')){ delEvent(existing.id); closeModal(); fb('undo'); toast('Évènement supprimé'); checkAch(); } };
    q('#f_save').onclick = () => {
      sync();
      const now = Date.now(), t = d.type, clean = {type: t, start: d.start};
      // Garde-fous
      if(!(d.start > 0)){ refuse('Indique une heure'); return; }
      if(d.start > now + 5 * MIN){ refuse("Cette heure est dans le futur"); return; }
      if(SPAN[t]){
        clean.end = d.end || null;
        if(d.end && d.end <= d.start){ refuse('La fin doit être après le début'); return; }
        if(d.end && d.end > now + 5 * MIN){ refuse("L'heure de fin est dans le futur"); return; }
        const dur = ((d.end || now) - d.start) / H;
        if(t === 'nap' && dur > 4 && !confirm('Cette sieste dure ' + fmtD(dur * 60) + '. Est-ce bien exact ?')) return;
        if(t === 'night' && dur > 16 && !confirm('Cette nuit dure ' + fmtD(dur * 60) + '. Est-ce bien exact ?')) return;
        if(t !== 'nwake'){
          const a = d.start, b = d.end || now;
          const clash = S.events.find(e => (e.type === 'nap' || e.type === 'night') && (!existing || e.id !== existing.id) && e.start < b && (e.end || now) > a);
          if(clash && !confirm('Ce sommeil chevauche « ' + eventInfo(clash).main + ' » (' + fmtT(clash.start) + '). Enregistrer quand même ?')) return;
        }
      }
      if(t === 'bottle'){
        clean.kind = d.kind;
        if(d.kind === 'bottle'){
          if(d.ml > 400 && !confirm(d.ml + ' ml, est-ce bien exact ?')) return;
          if(d.ml) clean.ml = d.ml;
        }
        if(d.kind === 'breast'){ if(d.side) clean.side = d.side; if(d.val > 0) clean.val = Math.min(d.val, 180); }
      }
      if(t === 'diaper') clean.kind = d.kind;
      if(t === 'temp'){
        if(!(d.val >= 34 && d.val <= 43)){ refuse('Température entre 34 et 43 °C attendue'); return; }
        clean.val = Math.round(d.val * 10) / 10;
      }
      if(t === 'growth'){
        let {w, h, hc} = d;
        if([w, h, hc].some(v => v != null && isNaN(v))){ refuse('Un des nombres est mal écrit'); return; }
        if(w != null && w >= 500) w = w / 1000;   // saisi en grammes
        if(w == null && h == null && hc == null){ refuse('Indique au moins une mesure'); return; }
        if(w != null && !(w >= 1 && w <= 30)){ refuse('Poids entre 1 et 30 kg attendu'); return; }
        if(h != null && !(h >= 30 && h <= 130)){ refuse('Taille entre 30 et 130 cm attendue'); return; }
        if(hc != null && !(hc >= 25 && hc <= 60)){ refuse('Périmètre crânien entre 25 et 60 cm attendu'); return; }
        const prev = S.events.filter(e => e.type === 'growth' && e.w != null && (!existing || e.id !== existing.id) && e.start < d.start).sort((a,b) => b.start - a.start)[0];
        if(w != null && prev && (w < prev.w * 0.9 || (d.start - prev.start < 30 * DAY && w > prev.w * 1.25))
          && !confirm('Le poids passe de ' + fmtNum(prev.w, 2) + ' kg à ' + fmtNum(w, 2) + ' kg. Est-ce bien exact ?')) return;
        if(w != null) clean.w = Math.round(w * 1000) / 1000;
        if(h != null) clean.h = Math.round(h * 10) / 10;
        if(hc != null) clean.hc = Math.round(hc * 10) / 10;
      }
      if((t === 'med' || t === 'note') && !d.note){ refuse(t === 'med' ? 'Indique le nom du médicament' : 'Écris ta note'); return; }
      if(d.note) clean.note = d.note;
      if(existing){ const i = S.events.findIndex(e => e.id === existing.id); S.events[i] = {id: existing.id, ...clean}; touch(S.events[i]); }
      else addEvent(clean);
      if(t === 'note' && d.atyp) setAtypical(startOfDay(d.start), true, noteParts(d.note).filter(x => ATYP_REASONS.includes(x)));
      closeModal();
      fb('save'); toast(eventInfo(clean).main + (existing ? ' : corrigé' : ' : enregistré')); checkAch();
    };
  };
  draw();
}

// ---------- Export, import, copies automatiques ----------
function download(name, mime, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function exportCSV(){
  const loc = t => t ? new Date(t - new Date(t).getTimezoneOffset() * MIN).toISOString().slice(0, 19) : '';
  const cell = v => /[;"\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const rows = [['type', 'debut', 'fin', 'duree_min', 'ml', 'detail', 'valeur', 'poids_kg', 'taille_cm', 'perimetre_cranien_cm', 'note']];
  S.events.slice().sort((a,b) => a.start - b.start).forEach(e => rows.push([
    e.type, loc(e.start), loc(e.end), e.end ? Math.round((e.end - e.start) / MIN) : '', e.ml ?? '', [e.kind, e.side].filter(Boolean).join(' '), e.val ?? '', e.w ?? '', e.h ?? '', e.hc ?? '', e.note ?? '']));
  download('doudodo.csv', 'text/csv', '﻿' + rows.map(r => r.map(cell).join(';')).join('\n'));
}
function importData(j, what){
  if(!j || !Array.isArray(j.events)){ toast('Fichier invalide'); return; }
  const valid = j.events.filter(e => e && typeof e.id === 'string' && fromDoc(e.id, e));
  if(S.sync){
    if(!confirm('Ajouter les ' + valid.length + ' évènements de ' + what + ' au foyer partagé ?')) return;
    S.sync.dirty = S.sync.dirty || {};
    valid.forEach(e => {
      const i = S.events.findIndex(x => x.id === e.id);
      if(i >= 0) S.events[i] = e; else S.events.push(e);
      S.sync.dirty[e.id] = {op: 'put', v: Date.now() + Math.random()};
    });
    save(); flushAll();
  } else {
    if(!confirm('Remplacer les données actuelles par ' + what + ' (' + valid.length + ' évènements) ?')) return;
    S.child = j.child || {name: '', birth: ''}; S.events = valid; save();
  }
  render(); toast('Données restaurées');
}
function autoSnapshot(){
  try{
    const today = toInput(Date.now()).slice(0, 10), cur = JSON.parse(localStorage.getItem(BAK) || 'null');
    if((cur && cur.day === today) || !S.events.length) return;
    if(cur) localStorage.setItem(BAK + '2', JSON.stringify(cur));
    localStorage.setItem(BAK, JSON.stringify({day: today, child: S.child, events: S.events}));
  }catch(e){ try{ localStorage.removeItem(BAK + '2'); }catch(_){} }
}
function snapshots(){
  return [BAK, BAK + '2'].map(k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }).filter(s => s && Array.isArray(s.events) && s.day);
}

function notifState(){ return !('Notification' in window) ? 'unsupported' : Notification.permission; }
function showNotif(title, body){
  const opt = {body, tag: 'dodo-sommeil', icon: 'icon-192.png', badge: 'icon-192.png'};
  const direct = () => { try{ new Notification(title, opt); }catch(e){} };
  if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, opt)).catch(direct);
  else direct();
}
let notifTimer;
function checkNotif(){
  syncSleepNotif();
  clearTimeout(notifTimer);
  if(!S.settings.notif || notifState() !== 'granted') return;
  const now = Date.now(), p = predict(S.events, now, S.child.birth);
  if(p.state !== 'awake') return;
  const at = p.from - S.settings.lead * MIN, key = p.ref + '|' + p.rank + '|' + (p.bedtime ? 'b' : 'n');
  if(now < at){ notifTimer = setTimeout(checkNotif, Math.min(at - now + 500, 2147480000)); return; }
  if(now <= p.to && S.settings.lastNotif !== key){
    S.settings.lastNotif = key; save();
    showNotif(p.bedtime ? 'Bientôt le coucher du soir' : 'Bientôt la sieste', 'Créneau conseillé pour ' + childName() + ' : entre ' + fmtT(p.from) + ' et ' + fmtT(p.to) + '.');
  }
}
async function toggleNotif(){
  if(S.settings.notif && notifState() === 'granted'){ S.settings.notif = false; save(); render(); toast('Rappels désactivés'); return; }
  if(notifState() === 'unsupported'){ toast('Notifications indisponibles sur ce navigateur'); return; }
  const r = await Notification.requestPermission();
  S.settings.notif = r === 'granted'; save(); render();
  toast(r === 'granted' ? 'Rappels activés' : 'Notifications refusées par le téléphone');
  checkNotif();
}

// <SYNCLOGIC>
const CODE_ALPHABET = 'abcdefghjkmnpqrstuvwxyz23456789';
const EVENT_TYPES = ['nap', 'night', 'wake', 'nwake', 'bottle', 'diaper', 'med', 'temp', 'note', 'growth'];
const EXTRA_FIELDS = ['ml', 'kind', 'side', 'val', 'w', 'h', 'hc', 'note'];
function newFamilyCode(rand){
  rand = rand || (n => { const a = new Uint32Array(n); crypto.getRandomValues(a); return Array.from(a); });
  let s = '';
  for(const x of rand(20)) s += CODE_ALPHABET[x % CODE_ALPHABET.length];
  return s.match(/.{4}/g).join('-');
}
function normalizeCode(input){
  const s = String(input || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if(s.length !== 20 || [...s].some(c => !CODE_ALPHABET.includes(c))) return null;
  return s.match(/.{4}/g).join('-');
}
function toDoc(e){
  const d = {type: e.type, start: e.start};
  if(SPAN[e.type]) d.end = e.end ?? null;
  for(const k of EXTRA_FIELDS) if(e[k] != null && e[k] !== '') d[k] = e[k];
  return d;
}
function fromDoc(id, d){
  if(!d || !EVENT_TYPES.includes(d.type) || typeof d.start !== 'number') return null;
  return {id, ...toDoc(d)};
}
const sigEvent = e => JSON.stringify(toDoc(e));
// changes: [{type:'added'|'modified'|'removed', id, data}] ; skipIds = évènements locaux pas encore envoyés
function applyRemote(events, changes, since, skipIds){
  let changed = false;
  for(const ch of changes){
    if(skipIds && skipIds[ch.id]) continue;
    const i = events.findIndex(e => e.id === ch.id);
    if(ch.type === 'removed'){
      if(i >= 0 && events[i].start >= since){ events.splice(i, 1); changed = true; }
      continue;
    }
    const ev = fromDoc(ch.id, ch.data);
    if(!ev) continue;
    if(i < 0){ events.push(ev); changed = true; }
    else if(sigEvent(events[i]) !== sigEvent(ev)){ events[i] = ev; changed = true; }
  }
  return changed;
}

function markDirty(id, op){
  if(!S.sync) return;
  S.sync.dirty = S.sync.dirty || {};
  S.sync.dirty[id] = {op, v: Date.now() + Math.random()};
  save();
  flushOne(id);
}
function flushOne(id){
  if(!S.sync || !SY.m || !SY.db) return;
  const d = S.sync.dirty && S.sync.dirty[id];
  if(!d) return;
  const {m, db} = SY, ref = m.doc(db, 'families', S.sync.fid, 'events', id);
  let p;
  if(d.op === 'del') p = m.deleteDoc(ref);
  else {
    const e = S.events.find(x => x.id === id);
    if(!e){ delete S.sync.dirty[id]; save(); return; }
    p = m.setDoc(ref, toDoc(e));
  }
  p.then(() => {
    const cur = S.sync && S.sync.dirty && S.sync.dirty[id];
    if(cur && cur.v === d.v){ delete S.sync.dirty[id]; save(); }
  }).catch(err => setSync('error', syncErr(err)));
}
function flushAll(){ if(S.sync && S.sync.dirty) Object.keys(S.sync.dirty).forEach(flushOne); }
let profTimer;
function syncProfile(){
  if(!S.sync || !SY.m || !SY.db) return;
  clearTimeout(profTimer);
  profTimer = setTimeout(() => {
    const {m, db} = SY;
    m.setDoc(m.doc(db, 'families', S.sync.fid), {name: S.child.name || '', birth: S.child.birth || ''}).catch(err => setSync('error', syncErr(err)));
  }, 600);
}
function stopSync(){
  SY.unsubs.forEach(f => { try{ f(); }catch(e){} });
  SY.unsubs = [];
  setSync('off');
}
async function startSync(fid){
  stopSync();
  setSync('connecting');
  try{
    await loadFirebase();
    const {m, db} = SY;
    const since = startOfDay(Date.now()) - SYNC_DAYS * DAY;
    const onErr = err => { console.error(err); setSync('error', syncErr(err)); };
    const evQuery = m.query(m.collection(db, 'families', fid, 'events'), m.where('start', '>=', since));
    SY.unsubs.push(m.onSnapshot(evQuery, {includeMetadataChanges: true}, snap => {
      const changes = snap.docChanges().map(c => ({type: c.type, id: c.doc.id, data: c.doc.data()}));
      if(!SY.foreign && changes.some(c => c.type !== 'removed' && c.data && !EVENT_TYPES.includes(c.data.type))){
        SY.foreign = true; checkUpdate(0);
        if(!document.querySelector('.overlay') && tab !== 'set') render();
      }
      if(applyRemote(S.events, changes, since, S.sync && S.sync.dirty)){
        save(); setTimeout(checkAch, 400);
        if(!document.querySelector('.overlay') && tab !== 'set') render();
        checkNotif();
      }
      if(!snap.metadata.fromCache) SY.lastRemote = Date.now();
      setSync(snap.metadata.fromCache ? 'offline' : 'ok');
    }, onErr));
    // Les mesures de croissance sont souvent recopiées du carnet de santé avec leur date d'origine :
    // on les synchronise toutes, quelle que soit leur ancienneté (elles sont peu nombreuses).
    const growthQuery = m.query(m.collection(db, 'families', fid, 'events'), m.where('type', '==', 'growth'));
    SY.unsubs.push(m.onSnapshot(growthQuery, snap => {
      const changes = snap.docChanges().map(c => ({type: c.type, id: c.doc.id, data: c.doc.data()}));
      if(applyRemote(S.events, changes, 0, S.sync && S.sync.dirty)){
        save(); setTimeout(checkAch, 400);
        if(!document.querySelector('.overlay') && tab !== 'set') render();
      }
    }, onErr));
    SY.unsubs.push(m.onSnapshot(m.doc(db, 'families', fid), snap => {
      const d = snap.data();
      if(!d) return;
      const nm = d.name || '', bd = d.birth || '';
      if(nm !== S.child.name || bd !== S.child.birth){
        S.child.name = nm; S.child.birth = bd; save();
        if(!document.querySelector('.overlay') && tab !== 'set') render();
      }
    }, onErr));
    flushAll();
  }catch(e){
    console.error(e);
    setSync('error', 'chargement impossible (pas de réseau ?)');
  }
}
async function createFamily(){
  if(!syncAvailable()){ toast('Partage non configuré'); return; }
  const fid = newFamilyCode();
  try{
    toast('Création du foyer…');
    await withTimeout(loadFirebase(), 15000);
    const {m, db} = SY;
    await withTimeout(m.setDoc(m.doc(db, 'families', fid), {name: S.child.name || '', birth: S.child.birth || ''}), 15000);
    const evs = S.events.filter(e => fromDoc(e.id, e));
    for(let i = 0; i < evs.length; i += 400){
      const b = m.writeBatch(db);
      evs.slice(i, i + 400).forEach(e => b.set(m.doc(db, 'families', fid, 'events', e.id), toDoc(e)));
      await withTimeout(b.commit(), 20000);
    }
    S.sync = {fid, dirty: {}}; save();
    await startSync(fid);
    render();
    toast('Foyer créé : donne le code à l\'autre personne');
  }catch(e){
    console.error(e);
    toast('Création impossible (' + syncErr(e) + ')');
  }
}
async function joinFamily(input){
  if(!syncAvailable()){ toast('Partage non configuré'); return; }
  const fid = normalizeCode(input);
  if(!fid){ toast('Code invalide : 20 caractères attendus'); return; }
  if(S.events.length && !confirm('Les ' + S.events.length + ' évènements déjà présents sur ce téléphone seront ajoutés au foyer. Continuer ?')) return;
  try{
    toast('Connexion au foyer…');
    await withTimeout(loadFirebase(), 15000);
    const {m, db} = SY;
    const snap = await withTimeout(m.getDocFromServer(m.doc(db, 'families', fid)), 15000);
    if(!snap.exists()){ toast('Code inconnu'); return; }
    S.sync = {fid, dirty: {}};
    S.events.forEach(e => { S.sync.dirty[e.id] = {op: 'put', v: Date.now() + Math.random()}; });
    save();
    await startSync(fid);
    render();
    toast('Foyer rejoint');
  }catch(e){
    console.error(e);
    toast('Connexion impossible (' + syncErr(e) + ')');
  }
}
// Récupère tout l'historique du foyer (la synchro courante ne lit que les 30 derniers jours).
async function fetchHistory(){
  if(!S.sync) return;
  try{
    toast('Récupération de l\'historique…');
    await withTimeout(loadFirebase(), 15000);
    const {m, db} = SY;
    const snap = await withTimeout(m.getDocs(m.collection(db, 'families', S.sync.fid, 'events')), 30000);
    const changes = snap.docs.map(d => ({type: 'added', id: d.id, data: d.data()}));
    if(applyRemote(S.events, changes, 0, S.sync.dirty)) save();
    render(); toast(changes.length + ' évènements dans le foyer, historique à jour');
  }catch(e){ console.error(e); toast('Récupération impossible (' + syncErr(e) + ')'); }
}
function leaveFamily(){
  if(!confirm('Quitter le foyer ? Les données restent sur ce téléphone mais ne sont plus partagées.')) return;
  stopSync(); S.sync = null; save(); render();
}
window.addEventListener('online', () => {
  if(S.sync && syncAvailable() && (SY.state === 'error' || !SY.unsubs.length)) startSync(S.sync.fid);
});

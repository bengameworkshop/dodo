// ---------- Thème et mode nuit doux ----------
function isSoft(){
  const st = S.settings.soft, h = new Date().getHours();
  return st === 'on' || (st !== 'off' && (h >= 21 || h < 7 || !!findOpen(S.events, 'night', Date.now(), 18)));
}
function applyTheme(){
  const r = document.documentElement, theme = S.settings.theme || 'dark', soft = isSoft();
  r.dataset.theme = theme; r.classList.toggle('soft', soft);
  const light = theme === 'light' || (theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = soft ? '#06040d' : light ? '#f6f2ff' : '#2a1766';
}

// ---------- Nouvelle version disponible ----------
let updateReady = null, lastUpdCheck = 0;
async function checkUpdate(minGap){
  if(!/^https?:$/.test(location.protocol) || Date.now() - lastUpdCheck < (minGap || 0)) return;
  lastUpdCheck = Date.now();
  try{
    const r = await fetch('index.html', {cache: 'no-store'});
    if(!r.ok) return;
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if(m && m[1] !== APP_VERSION && updateReady !== m[1]){
      updateReady = m[1];
      if(!document.querySelector('.overlay')) render();
    }
  }catch(e){}
}
function updateHTML(){
  if(updateReady) return `<div class="warn install"><div><b>Nouvelle version de Doudodo</b><small>Mets à jour pour avoir les dernières nouveautés et rester bien synchronisé avec l'autre téléphone.</small></div>
    <button class="btn small" data-act="reload">Mettre à jour</button></div>`;
  if(SY.foreign) return `<div class="warn"><div><b>Doudodo n'est pas à jour sur ce téléphone</b><small>L'autre téléphone a une version plus récente : certaines saisies ne s'affichent pas ici. Ferme complètement l'appli puis rouvre-la avec du réseau.</small></div>
    ${/^https?:$/.test(location.protocol) ? '<button class="btn small" data-act="reload">Mettre à jour</button>' : ''}</div>`;
  return '';
}

// ---------- Croissance ----------
function lineChart(pts, dec, unit, color, birth, label){
  const W = 320, HH = 176, L = 38, R = 14, T = 18, B = 28;
  const t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 7 * DAY);
  let v0 = Math.min(...pts.map(p => p.v)), v1 = Math.max(...pts.map(p => p.v));
  const padV = Math.max((v1 - v0) * 0.18, unit === 'kg' ? 0.2 : 0.8); v0 -= padV; v1 += padV;
  const X = t => L + (W - L - R) * (t - t0) / (t1 - t0), Y = v => T + (HH - T - B) * (1 - (v - v0) / (v1 - v0));
  const xl = t => {
    if(!birth) return new Date(t).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
    const days = (t - birth) / DAY;
    return days < 0 ? '' : days < 84 ? Math.round(days / 7) + ' sem.' : fmtNum(days / 30.4375, 1) + ' mois';
  };
  let g = '';
  for(let i = 0; i <= 3; i++){ const v = v0 + (v1 - v0) * i / 3, y = Y(v).toFixed(1); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="gl"/><text x="${L - 6}" y="${y}" class="gy">${fmtNum(v, unit === 'kg' ? 1 : 0)}</text>`; }
  for(const [t, a] of [[t0, 'start'], [(t0 + t1) / 2, 'middle'], [t1, 'end']]) g += `<text x="${X(t).toFixed(1)}" y="${HH - 8}" class="gx" text-anchor="${a}">${xl(t)}</text>`;
  const line = pts.map(p => `${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area = `M${X(pts[0].t).toFixed(1)} ${HH - B}L${line.replace(/ /g, 'L')}L${X(pts[pts.length - 1].t).toFixed(1)} ${HH - B}Z`;
  const last = pts[pts.length - 1], lx = X(last.t), ly = Y(last.v);
  return `<svg viewBox="0 0 ${W} ${HH}" class="lchart" role="img" aria-label="${esc(label)}">${g}
    <path d="${area}" fill="${color}" opacity=".14"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="var(--card)" stroke="${color}" stroke-width="2.5"/>`).join('')}
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="6" fill="${color}" style="filter:drop-shadow(0 0 6px ${color})"/>
    <text x="${Math.min(lx, W - R).toFixed(1)}" y="${(ly - 12).toFixed(1)}" class="lv">${fmtNum(last.v, dec)} ${unit}</text></svg>`;
}
function growthHTML(){
  const name = esc(childName());
  const list = S.events.filter(e => e.type === 'growth').sort((a,b) => b.start - a.start);
  const birth = S.child.birth ? new Date(S.child.birth + 'T00:00:00').getTime() : null;
  const MEAS = [['w', 'Poids', 'kg', 2, 'var(--accent)'], ['h', 'Taille', 'cm', 1, 'var(--med)'], ['hc', 'Périmètre crânien', 'cm', 1, 'var(--pee)']];
  const short = t => new Date(t).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
  let cards = '', charts = '';
  for(const [k, label, unit, dec, color] of MEAS){
    const pts = list.filter(e => e[k] != null).map(e => ({t: e.start, v: e[k]})).reverse();
    if(!pts.length) continue;
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    let trend = '';
    if(prev && last.t - prev.t >= DAY){
      const days = (last.t - prev.t) / DAY;
      if(k === 'w'){ const gr = Math.round((last.v - prev.v) * 1000 / days * 7); trend = (gr >= 0 ? '+' : '') + gr + ' g par semaine'; }
      else { const c = (last.v - prev.v) / days * 30.4375; trend = (c >= 0 ? '+' : '') + fmtNum(c, 1) + ' cm par mois'; }
      trend += ' depuis le ' + short(prev.t);
    }
    cards += `<div class="gcard"><span>${label}</span><b>${fmtNum(last.v, dec)} ${unit}</b><small>le ${short(last.t)}</small>${trend ? `<small class="tr">${trend}</small>` : ''}</div>`;
    charts += `<h2>${label}</h2><div class="card">${pts.length >= 2 ? lineChart(pts, dec, unit, color, birth, label + ' de ' + childName())
      : '<p class="note" style="margin:0">Une deuxième mesure permettra de tracer la courbe.</p>'}</div>`;
  }
  return `<h1>Croissance</h1><p class="sub">Poids, taille et périmètre crânien de ${name}, par exemple après une pesée ou une visite chez le pédiatre.</p>
    <button class="btn" data-act="add" data-type="growth" data-lock="1">Ajouter une mesure</button>
    ${list.length ? `<div class="gcards">${cards}</div>${charts}<h2>Toutes les mesures</h2><div class="card rows">${rowsHTML(list, '')}</div>`
      : '<div class="card empty" style="margin-top:12px">Aucune mesure pour le moment. Ajoute la dernière pesée, celle du carnet de santé par exemple.</div>'}
    <p class="note">Les courbes de référence du carnet de santé ne sont pas affichées ici. C'est le pédiatre qui dit si la croissance est normale.</p>`;
}

// ---------- Sons doux et vibrations ----------
// Sons synthétisés à la volée (pas de fichier à télécharger) : notes sinusoïdales courtes, filtrées.
let AC = null, MASTER = null;
function audio(){
  if(!S.settings.sound) return null;
  try{
    if(!AC){
      const C = window.AudioContext || window.webkitAudioContext; if(!C) return null;
      AC = new C(); MASTER = AC.createGain();
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3000;
      MASTER.connect(lp); lp.connect(AC.destination);
    }
    if(AC.state === 'suspended') AC.resume();
    MASTER.gain.value = isSoft() ? 0.3 : 0.75;
    return AC;
  }catch(e){ return null; }
}
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
// [note, départ (s), durée (s), glissé vers la note]
const SOUNDS = {
  save: [[72, 0, .18], [79, .07, .3]],
  meal: [[74, 0, .14], [79, .06, .16], [83, .12, .32]],
  diaper: [[69, 0, .2, 84], [81, .1, .2]],
  sleep: [[76, 0, .34], [72, .16, .38], [67, .32, .6]],
  wake: [[67, 0, .22], [72, .1, .22], [76, .2, .4]],
  tap: [[84, 0, .09]],
  undo: [[74, 0, .24, 66]],
  error: [[57, 0, .18], [55, .12, .28]],
  boop: [[81, 0, .1, 88], [88, .1, .16, 83]],
  achieve: [[72, 0, .4], [76, .09, .4], [79, .18, .4], [84, .27, .7], [88, .38, .9]]
};
function play(kind){
  const ctx = audio(); if(!ctx || !SOUNDS[kind]) return;
  const t0 = ctx.currentTime + .01, peak = kind === 'achieve' ? .08 : .11;
  for(const [n, dt, d, glide] of SOUNDS[kind]){
    const at = t0 + dt;
    for(const [mult, lvl, len] of [[1, peak, d], [2, peak * .15, d * .55]]){
      if(kind === 'error' && mult === 2) continue;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = kind === 'error' ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(NOTE(n) * mult, at);
      if(glide) o.frequency.exponentialRampToValueAtTime(NOTE(glide) * mult, at + len * .8);
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(lvl, at + .012); g.gain.exponentialRampToValueAtTime(.0001, at + len);
      o.connect(g); g.connect(MASTER); o.start(at); o.stop(at + len + .05);
    }
  }
}
const VIB = {save: 12, meal: 12, diaper: 12, sleep: [10, 40, 10], wake: [10, 40, 10], tap: 8, undo: 10, error: [30, 40, 30], boop: 10, achieve: [15, 50, 15, 50, 30]};
function fb(kind){ play(kind); try{ if(S.settings.haptic && navigator.vibrate) navigator.vibrate(VIB[kind] || 10); }catch(e){} }
function refuse(msg){ toast(msg, null, null, 'error'); fb('error'); }

// Les animations en boucle gardent leur rythme quand l'écran est redessiné (toutes les 30 s).
function syncAnims(){
  if(!document.getAnimations) return;
  const now = performance.now();
  for(const a of document.getAnimations()){
    try{ if(a.effect && a.effect.getComputedTiming().iterations === Infinity) a.currentTime = now; }catch(e){}
  }
}

// ---------- Le doudou vivant ----------
function doudouMood(p, now){
  if(p.state === 'night') return ['asleep', 'Bonne nuit… je fais de beaux rêves'];
  if(p.state === 'sleeping') return ['asleep', 'Chut… je fais ma sieste'];
  if(p.state === 'noref') return ['awake', 'Bonjour ! Note mon réveil du matin'];
  if(now < p.from - 20 * MIN) return ['awake', 'Je suis en pleine forme !'];
  if(now < p.from) return ['sleepy', 'Je commence à fatiguer…'];
  if(now <= p.to) return ['yawn', p.bedtime ? "Je bâille… c'est l'heure du dodo" : "Je bâille… c'est l'heure de la sieste"];
  return ['sleepy', 'Je suis très fatigué…'];
}

const ACH = [

function achCounts(now){
  const c = {naps: 0, nights: 0, meals: 0, diapers: 0, growth: 0, bestNight: 0, hits: S.settings.hits || 0, days: 0};
  let first = Infinity;
  const wakes = S.events.filter(e => e.type === 'nwake').map(e => e.start);
  for(const e of S.events){
    if(e.type === 'nap') c.naps++; else if(e.type === 'bottle') c.meals++; else if(e.type === 'diaper') c.diapers++; else if(e.type === 'growth') c.growth++;
    if(['nap', 'night', 'bottle', 'diaper'].includes(e.type)) first = Math.min(first, e.start);
    if(e.type === 'night' && e.end){
      c.nights++;
      const pts = [e.start, ...wakes.filter(w => w > e.start && w < e.end), e.end].sort((a,b) => a - b);
      for(let i = 1; i < pts.length; i++) c.bestNight = Math.max(c.bestNight, pts[i] - pts[i - 1]);
    }
  }
  c.days = first < Infinity ? (now - first) / DAY : 0;
  c.learned = () => learnInfo(now).pct >= 100;
  return c;
}
// Mois-anniversaire : « Léa a 5 mois aujourd'hui ! »
function monthiversary(now){
  if(!S.child.birth) return null;
  const b = new Date(S.child.birth + 'T00:00:00'), d = new Date(now);
  if(isNaN(b)) return null;
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  if(d.getDate() !== Math.min(b.getDate(), dim)) return null;
  const m = (d.getFullYear() - b.getFullYear()) * 12 + d.getMonth() - b.getMonth();
  if(m < 1) return null;
  const txt = m % 12 === 0 ? (m / 12) + (m === 12 ? ' an' : ' ans') : m + ' mois';
  return {id: 'age' + m, ic: 'heart', title: childName().replace(/^./, x => x.toUpperCase()) + ' a ' + txt + " aujourd'hui !", desc: 'Joyeux anniversaire, petit trésor'};
}
let achQueue = [], achShowing = false;
function checkAch(){
  const now = Date.now(), c = achCounts(now), mv = monthiversary(now);
  if(!S.settings.ach){   // première fois : on garde ce qui est déjà acquis sans le fêter
    S.settings.ach = {};
    for(const a of ACH) if(a.ok(c)) S.settings.ach[a.id] = now;
    if(mv) S.settings.ach[mv.id] = now;
    save(); return;
  }
  const fresh = ACH.filter(a => !S.settings.ach[a.id] && a.ok(c));
  if(mv && !S.settings.ach[mv.id]) fresh.push(mv);
  if(!fresh.length) return;
  for(const a of fresh) S.settings.ach[a.id] = now;
  save();
  for(const a of fresh){
    achQueue.push(a);
    if(document.hidden && notifState() === 'granted') showNotif('Nouveau badge : ' + a.title, a.desc);
  }
  if(!achShowing) nextAch();
}
function nextAch(){
  const a = achQueue.shift();
  if(!a){ achShowing = false; return; }
  achShowing = true;
  const el = document.createElement('div'); el.className = 'ach'; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="medal">${icon(a.ic)}${Array.from({length: 12}, (_, i) => `<i class="spark" style="--a:${i * 30}deg;animation-delay:${(i % 3) * .06}s"></i>`).join('')}</span>
    <div><small>Nouveau badge</small><b>${esc(a.title)}</b><span class="d">${esc(a.desc)}</span></div>`;
  const close = () => { if(el.classList.contains('out')) return; el.classList.add('out'); setTimeout(() => { el.remove(); setTimeout(nextAch, 250); }, 350); };
  el.onclick = close;
  document.body.appendChild(el); fb('achieve');
  setTimeout(close, 5200);
}

// ---------- Raccourcis et actions venues de la notification ----------
function doAction(what){
  if(!what) return;
  const now = Date.now();
  if(what === 'sleep'){
    if(findOpen(S.events, 'night', now, 18)) what = 'endnight';
    else if(findOpen(S.events, 'nap', now, 12)) what = 'endnap';
    else { const p = predict(S.events, now, S.child.birth); what = p.state === 'awake' && p.bedtime ? 'startnight' : 'startnap'; }
  }
  const [a, kind] = what.split('-');
  if(!['startnap', 'startnight', 'endnap', 'endnight', 'meal', 'diaper'].includes(a)) return;
  if(a === 'endnap' && !findOpen(S.events, 'nap', now, 12)){ toast('Aucune sieste en cours'); return; }
  if(a === 'endnight' && !findOpen(S.events, 'night', now, 18)){ toast('Aucune nuit en cours'); return; }
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  tab = 'home';
  act({dataset: {act: a, kind}, querySelector: () => null});
}
// Notification qui reste affichée pendant une sieste ou une nuit, avec un bouton pour la terminer
let sleepNotifKey;
async function syncSleepNotif(){
  try{
    if(!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
    const now = Date.now(), open = findOpen(S.events, 'night', now, 18) || findOpen(S.events, 'nap', now, 12);
    const want = open && S.settings.notif && notifState() === 'granted';
    const key = want ? open.id + '|' + open.start : null;
    if(key === sleepNotifKey) return;
    sleepNotifKey = key;
    const reg = await navigator.serviceWorker.ready;
    (await reg.getNotifications({tag: 'dodo-encours'})).forEach(n => n.close());
    if(!want) return;
    const night = open.type === 'night', p = predict(S.events, now, S.child.birth);
    await reg.showNotification(night ? 'Nuit en cours' : 'Sieste en cours', {
      body: (night ? 'Coucher à ' : 'Commencée à ') + fmtT(open.start) + (p.wakeAt ? '. Réveil habituel vers ' + fmtT(p.wakeAt) + '.' : '.'),
      tag: 'dodo-encours', silent: true, requireInteraction: true, icon: 'icon-192.png', badge: 'icon-192.png',
      actions: [{action: night ? 'endnight' : 'endnap', title: night ? 'Terminer la nuit' : 'Terminer la sieste'}]
    });
  }catch(e){ console.warn('Notification en cours', e); }
}

async function onbAct(k){
  if(!OB) return;
  if(k === 'next') OB.i++;
  else if(k === 'back'){ OB.i--; OB.joining = false; }
  else if(k === 'joinform') OB.joining = true;
  else if(k === 'nojoin') OB.joining = false;
  else if(k === 'child'){
    const nm = $('#ob_name').value.trim(), bd = $('#ob_birth').value;

    S.child.name = nm; S.child.birth = bd; save(); syncProfile(); OB.i++;
  }
  else if(k === 'create'){ await createFamily(); if(!S.sync) return; }
  else if(k === 'join'){ await joinFamily($('#ob_code').value); if(!S.sync) return; OB.joining = false; OB.i++; }
  else if(k === 'notif'){
    S.settings.notif = true; S.settings.notifAsked = true; save();
    try{ const r = await Notification.requestPermission(); if(r !== 'granted') toast('Rappels refusés : tu pourras les autoriser plus tard'); }catch(e){}
    OB.i++;
  }
  else if(k === 'nonotif'){ S.settings.notifAsked = true; save(); OB.i++; }
  else if(k === 'done'){ closeOnb(); fb('save'); return; }
  if(!OB) return;
  OB.i = Math.max(0, Math.min(OB.steps.length - 1, OB.i));
  drawOnb(); fb('tap');
}

// ---------- Glisser une ligne vers la gauche pour la supprimer ----------
let SWP = null, swipeEndedAt = 0;
document.addEventListener('pointerdown', ev => {
  const row = ev.target.closest('.swipe .row');
  if(!row || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
  SWP = {row, wrap: row.parentElement, x0: ev.clientX, y0: ev.clientY, dx: 0, mode: null, id: ev.pointerId};
});
document.addEventListener('pointermove', ev => {
  if(!SWP || ev.pointerId !== SWP.id) return;
  const dx = ev.clientX - SWP.x0, dy = ev.clientY - SWP.y0;
  if(!SWP.mode){
    if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3){ SWP.mode = 'h'; SWP.wrap.classList.add('dragging'); try{ SWP.row.setPointerCapture(ev.pointerId); }catch(e){} }
    else if(Math.abs(dy) > 10){ SWP = null; return; }
    else return;
  }
  SWP.dx = Math.min(0, dx);
  SWP.row.style.transform = `translateX(${SWP.dx}px)`;
  const armed = SWP.dx < -SWP.wrap.offsetWidth * .35;
  if(armed !== SWP.wrap.classList.contains('armed')){ SWP.wrap.classList.toggle('armed', armed); if(armed) try{ if(S.settings.haptic && navigator.vibrate) navigator.vibrate(8); }catch(e){} }
});
function endSwipe(ev){
  if(!SWP || ev.pointerId !== SWP.id) return;
  const s = SWP; SWP = null;
  if(s.mode !== 'h') return;
  swipeEndedAt = Date.now();
  s.wrap.classList.remove('dragging');
  if(s.dx < -s.wrap.offsetWidth * .35){
    s.row.style.transform = 'translateX(-105%)'; s.wrap.classList.add('gone');
    const id = s.row.dataset.id; setTimeout(() => swipeDelete(id), 260);
  } else { s.row.style.transform = ''; s.wrap.classList.remove('armed'); }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);
function swipeDelete(id){
  const ev = S.events.find(e => e.id === id);
  if(!ev) return;
  const copy = {...ev};
  delEvent(id); render(); fb('undo');
  toast(eventInfo(copy).main + ' : supprimé', () => { S.events.push(copy); save(); markDirty(copy.id, 'put'); checkAch(); });
  checkAch();
}

// ---------- Actions ----------
function act(el){
  const a = el.dataset.act, now = Date.now();
  const undoAdd = id => () => delEvent(id);
  if(a === 'tab'){ tab = el.dataset.tab; if(tab === 'log') viewDay = startOfDay(now); render(); window.scrollTo(0, 0); }
  else if(a === 'startnap' || a === 'startnight'){
    const type = a === 'startnap' ? 'nap' : 'night';
    if(findOpen(S.events, 'nap', now, 12) || findOpen(S.events, 'night', now, 18)){ refuse('Un sommeil est déjà en cours'); render(); return; }
    const pb = predict(S.events, now, S.child.birth);
    const hit = type === 'nap' && pb.state === 'awake' && !pb.bedtime && now >= pb.from && now <= pb.to;
    if(hit){ S.settings.hits = (S.settings.hits || 0) + 1; save(); }
    const id = addEvent({type, start: now, end: null}); render(); fb('sleep');
    toast((type === 'nap' ? 'Sieste démarrée à ' : 'Nuit démarrée à ') + fmtT(now) + (hit ? ', pile dans le créneau' : ''), () => { delEvent(id); if(hit){ S.settings.hits--; save(); } });
  }
  else if(a === 'endnap' || a === 'endnight'){
    const open = a === 'endnap' ? findOpen(S.events, 'nap', now, 12) : findOpen(S.events, 'night', now, 18);
    if(open){
      open.end = Math.max(now, open.start + MIN); touch(open); render(); fb('wake');
      toast((a === 'endnap' ? 'Sieste terminée à ' : 'Nuit terminée, réveil à ') + fmtT(open.end), () => { open.end = null; touch(open); });
    }
  }
  else if(a === 'nwake'){ const id = addEvent({type: 'nwake', start: now, end: null}); render(); fb('tap'); toast('Réveil nocturne noté à ' + fmtT(now), undoAdd(id)); }
  else if(a === 'wake'){ const id = addEvent({type: 'wake', start: now}); render(); fb('wake'); toast('Réveil enregistré à ' + fmtT(now), undoAdd(id)); }
  else if(a === 'diaper'){ const id = addEvent({type: 'diaper', start: now, kind: el.dataset.kind}); render(); fb('diaper'); toast(diaperLabel(el.dataset.kind) + ' noté à ' + fmtT(now), undoAdd(id)); }
  else if(a === 'bottle') openEditor(null, {type: 'bottle', lock: true});
  else if(a === 'meal'){
    const kind = el.dataset.kind, id = addEvent({type: 'bottle', kind, start: now}); render();
    const what = {bottle: 'Biberon noté à ', breast: 'Tétée notée à ', solid: 'Repas solide noté à '}[kind] || 'Repas noté à ';
    fb('meal'); toast(what + fmtT(now), undoAdd(id));
  }
  else if(a === 'add') openEditor(null, {type: el.dataset.type, day: el.dataset.day ? +el.dataset.day : null, lock: !!el.dataset.lock});
  else if(a === 'edit') openEditor(el.dataset.id);
  else if(a === 'prevday'){ const d = new Date(viewDay); d.setDate(d.getDate() - 1); viewDay = d.getTime(); render(); }
  else if(a === 'nextday'){ const d = new Date(viewDay); d.setDate(d.getDate() + 1); viewDay = Math.min(d.getTime(), startOfDay(now)); render(); }
  else if(a === 'notif') toggleNotif();
  else if(a === 'install'){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.then(() => { installEvt = null; render(); }); } }
  else if(a === 'hideinstall'){ S.settings.hideInstall = true; save(); render(); }
  else if(a === 'theme'){ S.settings.theme = el.dataset.v; save(); render(); fb('tap'); }
  else if(a === 'sound'){ S.settings.sound = !S.settings.sound; save(); render(); if(S.settings.sound){ fb('save'); toast('Sons activés'); } else toast('Sons désactivés'); }
  else if(a === 'haptic'){ S.settings.haptic = !S.settings.haptic; save(); render(); fb('tap'); toast(S.settings.haptic ? 'Vibrations activées' : 'Vibrations désactivées'); }
  else if(a === 'doudou'){ const sv = el.querySelector('svg'); if(sv){ sv.classList.remove('wiggle'); void sv.getBoundingClientRect(); sv.classList.add('wiggle'); } fb('boop'); }
  else if(a === 'soft'){ S.settings.soft = el.dataset.v; save(); render(); fb('tap'); }
  else if(a === 'reload') location.reload();
  else if(a === 'tuto') openOnboarding('tuto');
  else if(a === 'atyp'){ const ds = +el.dataset.day, on = !atypMarker(ds); setAtypical(ds, on, []); render(); fb(on ? 'save' : 'undo'); toast(on ? 'Journée marquée comme particulière' : 'Journée de nouveau normale'); }
  else if(a === 'atypr'){
    const ds = +el.dataset.day, m = atypMarker(ds), r = el.dataset.r;
    if(m){ const cur = noteParts(m.note); m.note = (cur.includes(r) ? cur.filter(x => x !== r) : cur.concat(r)).join(', '); touch(m); render(); fb('tap'); }
  }
  else if(a === 'syncnow'){ checkUpdate(0); if(S.sync && syncAvailable()) startSync(S.sync.fid).then(() => { toast('Synchronisation relancée'); if(tab === 'set') render(); }); }
  else if(a === 'exportjson') download('doudodo-sauvegarde-' + toInput(now).slice(0, 10) + '.json', 'application/json', JSON.stringify({child: S.child, events: S.events}, null, 1));
  else if(a === 'exportcsv') exportCSV();
  else if(a === 'importjson') $('#importfile').click();
  else if(a === 'restoresnap'){ const s = snapshots()[+el.dataset.i]; if(s) importData(s, 'la copie du ' + s.day.split('-').reverse().slice(0, 2).join('/')); }
  else if(a === 'synchistory') fetchHistory();
  else if(a === 'synccreate') createFamily();
  else if(a === 'syncjoin') joinFamily($('#j_code') ? $('#j_code').value : '');
  else if(a === 'syncleave') leaveFamily();
  else if(a === 'synccopy'){ navigator.clipboard.writeText(S.sync.fid).then(() => toast('Code copié'), () => prompt('Copie ce code :', S.sync.fid)); }
  else if(a === 'syncshare'){ navigator.share({text: 'Code Doudodo : ' + S.sync.fid}).catch(() => {}); }
  else if(a === 'wipe'){
    if(S.sync){ refuse("Quitte d'abord le foyer pour tout effacer"); return; }
    if(confirm('Effacer TOUTES les données de ce téléphone ? Pense à télécharger une sauvegarde avant.') && confirm('Vraiment tout effacer ?')){
      S = {child: {name: '', birth: ''}, events: [], settings: S.settings}; save(); render();
    }
  }
  checkNotif(); checkAch();
  // Rappels : l'autorisation du téléphone est demandée une seule fois, lors d'une première saisie
  if(['startnap', 'startnight', 'endnap', 'endnight', 'wake', 'nwake', 'meal', 'diaper'].includes(a)) askNotifOnce();
}
function askNotifOnce(){
  if(!S.settings.notif || S.settings.notifAsked || notifState() !== 'default') return;
  S.settings.notifAsked = true; save();
  Notification.requestPermission().then(r => {
    if(r === 'granted'){ setTimeout(() => toast('Rappels activés : je te préviens ' + S.settings.lead + ' min avant la sieste'), 1800); checkNotif(); }
    if(tab === 'set') render();
  }).catch(() => {});
}
document.addEventListener('click', ev => {
  if(Date.now() - swipeEndedAt < 450 && ev.target.closest('.swipe')){ ev.preventDefault(); return; }
  const ob = ev.target.closest('[data-ob]');
  if(ob){ ev.preventDefault(); onbAct(ob.dataset.ob); return; }
  const el = ev.target.closest('[data-act]');
  if(el){ ev.preventDefault(); act(el); }
});
document.addEventListener('input', ev => {
  if(ev.target.id === 's_name'){ S.child.name = ev.target.value; save(); syncProfile(); }
  if(ev.target.id === 's_birth'){ S.child.birth = ev.target.value; save(); syncProfile(); }
});
document.addEventListener('change', ev => {
  if(ev.target.id === 's_lead'){ S.settings.lead = +ev.target.value; S.settings.lastNotif = null; save(); checkNotif(); }
  if(ev.target.id === 'importfile' && ev.target.files[0]){
    const r = new FileReader();
    r.onload = () => { let j = null; try{ j = JSON.parse(r.result); }catch(e){} importData(j, 'ce fichier'); };
    r.readAsText(ev.target.files[0]); ev.target.value = '';
  }
});

// Rafraîchit l'accueil, vérifie les rappels, fait la copie automatique du jour.
function tick(){ if(tab === 'home' && !document.querySelector('.overlay')) render(); checkNotif(); autoSnapshot(); checkUpdate(60 * MIN); checkAch(); }
setInterval(tick, 30000);
// Au retour sur l'appli après plus d'une minute, on relance l'écoute du foyer : sur mobile, la connexion
// peut rester figée après une mise en veille et l'écran ne recevrait plus les saisies de l'autre téléphone.
let hiddenAt = 0;
function resume(force){
  if(S.sync && syncAvailable() && (force || (hiddenAt && Date.now() - hiddenAt > 60000))) startSync(S.sync.fid);
  hiddenAt = 0;
  if(!document.querySelector('.overlay') && tab !== 'set') render();
  checkNotif(); checkUpdate(10 * MIN);
}
document.addEventListener('visibilitychange', () => { if(document.hidden) hiddenAt = Date.now(); else resume(false); });
window.addEventListener('pageshow', e => { if(e.persisted) resume(true); });

autoSnapshot();
render();
if(!S.settings.onboarded){
  if(S.events.length === 0 && !S.sync) openOnboarding('full');
  else { S.settings.onboarded = 1; save(); }
}
// Raccourcis de l'icône et bouton de la notification : ./?do=...
const qsDo = new URLSearchParams(location.search).get('do');
if(qsDo){ try{ history.replaceState(null, '', location.pathname); }catch(e){} if(S.settings.onboarded) setTimeout(() => doAction(qsDo), 250); }
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if(e.data && e.data.do) doAction(e.data.do); });
if(S.sync && syncAvailable()) startSync(S.sync.fid);
checkNotif();
setTimeout(() => checkUpdate(0), 4000);
setTimeout(checkAch, 1200);

// Mode hors ligne / installation (uniquement quand la page est servie en http ou https)
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker non enregistré', e));
}
</script>
